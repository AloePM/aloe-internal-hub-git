<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Directory — Aloe Hub</title>
<style>
  /* ============================================================
     TOKENS
     Deep aloe green for identity/structure, warm sand background
     (paper, not stark white — easier on the eyes for a page staff
     will sit in for a while), amber for the priority signal since
     that's the one number on this page people actually scan for.
     Monospace for phone/email — these are data to copy, not prose.
  ============================================================= */
  :root{
    /* Pulled from AloePM-Logo_FullColor.svg: the wordmark + house-accent teal
       is #40BCDB (--aloe-500 below, kept true to the mark). Darker/lighter
       steps are derived from it for contrast. The neutral grays (--sand-*,
       --ink-*) are lifted from the logo's house-icon grays (#B9BDC0/#B0AFB4/
       #B2AFB0) rather than an unrelated gray scale, so the whole UI reads as
       one family with the mark. */
    --aloe-900:#164a5c;
    --aloe-700:#1f7f9b;
    --aloe-500:#5cc9e3;
    --aloe-200:#cdeef5;
    --aloe-100:#eefafd;
    --sand-50:#f7f8f8;
    --sand-100:#eef0f0;
    --sand-200:#dcdfe0;
    --ink-900:#292c2e;
    --ink-600:#5f6467;
    --ink-400:#9aa0a3;
    --amber-600:#b8792f;
    --amber-100:#f6e9d4;
    --red-600:#a3402f;
    --red-100:#f5e2dd;
    --radius:10px;
    --shadow-card:0 1px 2px rgba(18,56,69,0.07), 0 1px 1px rgba(18,56,69,0.05);
    --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-data:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-ui);
    background:var(--sand-50);
    color:var(--ink-900);
    font-size:14px;
    line-height:1.45;
  }

  /* ---------- Shell layout ---------- */
  .shell{display:grid; grid-template-columns:240px 1fr; grid-template-rows:56px 1fr; height:100vh;}

  .topbar{
    grid-column:1/3;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    background:#ffffff;
    border-bottom:1px solid var(--sand-200);
    color:var(--ink-900);
  }
  .topbar .brand{display:flex; align-items:center; gap:12px; font-weight:600; letter-spacing:.01em;}
  .topbar .brand img{height:36px; width:auto; display:block;}
  .topbar .brand .divider{width:1px; height:18px; background:var(--sand-200);}
  .topbar .brand .section{color:var(--ink-600); font-weight:500;}
  .topbar .status{font-size:12px; color:var(--ink-400); font-family:var(--font-data);}
  .topbar .status.unsaved{color:var(--amber-600);}
  .topbar .status.error{color:var(--red-600);}

  .sidebar{
    background:var(--sand-100);
    border-right:1px solid var(--sand-200);
    overflow-y:auto;
    padding:16px 10px;
  }
  .sidebar h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-400); margin:6px 10px 10px;
    font-weight:600;
  }
  .trade-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px; margin-bottom:2px;
    border-radius:8px; cursor:pointer;
    color:var(--ink-600);
    font-weight:500;
  }
  .trade-item:hover{background:var(--sand-200);}
  .trade-item.active{background:var(--aloe-700); color:#fff;}
  .trade-item .count{
    font-family:var(--font-data); font-size:12px;
    color:var(--ink-400);
  }
  .trade-item.active .count{color:var(--aloe-200);}
  .trade-add{
    margin:10px 6px 0; width:calc(100% - 12px);
    padding:8px 10px; border-radius:8px;
    border:1px dashed var(--sand-200); background:transparent;
    color:var(--ink-400); font-size:12px; cursor:pointer;
    font-family:var(--font-ui);
  }
  .trade-add:hover{border-color:var(--aloe-500); color:var(--aloe-700);}

  .main{overflow-y:auto; padding:24px 28px 60px;}
  .main-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; flex-wrap:wrap; gap:10px;
  }
  .main-head h1{font-size:20px; margin:0; font-weight:650; color:var(--aloe-900);}
  .main-head .sub{font-size:12.5px; color:var(--ink-400); margin-top:2px;}
  .head-actions{display:flex; gap:8px;}

  button{font-family:var(--font-ui); cursor:pointer;}
  .btn{
    padding:8px 14px; border-radius:8px; border:1px solid var(--sand-200);
    background:#fff; color:var(--ink-900); font-size:13px; font-weight:500;
  }
  .btn:hover{border-color:var(--aloe-500);}
  .btn-primary{background:var(--aloe-700); border-color:var(--aloe-700); color:#fff;}
  .btn-primary:hover{background:var(--aloe-900);}
  .btn-ghost{border-color:transparent; background:transparent; color:var(--ink-600);}
  .btn-ghost:hover{background:var(--sand-200);}
  .btn-danger{color:var(--red-600);}

  /* ---------- Vendor cards ---------- */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
  .card{
    background:#fff; border:1px solid var(--sand-200); border-radius:var(--radius);
    box-shadow:var(--shadow-card); padding:14px; position:relative;
  }
  .card.inactive{opacity:.55;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .priority-badge{
    display:flex; align-items:center; gap:5px;
    font-family:var(--font-data); font-size:12px;
    color:var(--amber-600); background:var(--amber-100);
    border-radius:6px; padding:3px 7px; flex-shrink:0;
  }
  .priority-badge input{
    width:26px; border:none; background:transparent; text-align:center;
    font-family:var(--font-data); font-size:12px; color:var(--amber-600);
  }
  .field{margin-top:8px;}
  .field label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-400); margin-bottom:3px;}
  .field label .hint{text-transform:none; letter-spacing:0; font-size:10.5px; color:var(--ink-400); font-weight:400;}
  .flag-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
  .flag-chip{
    font-size:10.5px; padding:2px 7px; border-radius:5px;
    background:var(--amber-100); color:var(--amber-600); font-weight:600;
    font-family:var(--font-data);
  }
  .field input, .field textarea{
    width:100%; border:1px solid transparent; border-radius:6px;
    padding:5px 7px; font-size:13px; font-family:var(--font-ui); color:var(--ink-900);
    background:var(--sand-50);
  }
  .field input.mono, .field .mono{font-family:var(--font-data);}
  .field input:focus, .field textarea:focus{
    outline:none; border-color:var(--aloe-500); background:#fff;
  }
  .field textarea{resize:vertical; min-height:38px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .card-name-input{
    font-size:15px; font-weight:600; border:none; background:transparent;
    padding:2px 0; width:100%; color:var(--ink-900);
  }
  .card-name-input:focus{outline:none; border-bottom:1px solid var(--aloe-500);}

  .trade-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:10px;}
  .trade-chip{
    font-size:10.5px; padding:2px 7px; border-radius:20px;
    background:var(--aloe-100); color:var(--aloe-700); font-weight:500;
  }
  .trade-chip.current{background:var(--aloe-700); color:#fff;}

  .card-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; padding-top:10px; border-top:1px solid var(--sand-100);
  }
  .active-toggle{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-600);}
  .active-toggle input{accent-color:var(--aloe-700);}

  .empty-state{
    border:1px dashed var(--sand-200); border-radius:var(--radius);
    padding:40px 20px; text-align:center; color:var(--ink-400);
  }
  .empty-state .btn-primary{margin-top:12px;}

  /* ---------- Import panel (slide-over) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(31,58,42,0.25);
    display:none; z-index:20;
  }
  .overlay.open{display:block;}
  .panel{
    position:fixed; top:0; right:0; height:100%; width:380px;
    background:#fff; box-shadow:-6px 0 24px rgba(31,58,42,0.15);
    transform:translateX(100%); transition:transform .18s ease;
    z-index:21; display:flex; flex-direction:column;
  }
  .panel.open{transform:translateX(0);}
  .panel-head{
    padding:16px 18px; border-bottom:1px solid var(--sand-200);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-head h3{margin:0; font-size:15px;}
  .panel-search{padding:12px 18px; border-bottom:1px solid var(--sand-200);}
  .panel-search input{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--sand-200);
    font-size:13px; font-family:var(--font-ui);
  }
  .panel-list{overflow-y:auto; flex:1; padding:6px 10px;}
  .rv-row{
    padding:9px 8px; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; gap:1px;
  }
  .rv-row:hover{background:var(--sand-100);}
  .rv-row .name{font-size:13px; font-weight:600;}
  .rv-row .meta{font-size:11.5px; color:var(--ink-400); font-family:var(--font-data);}
  .rv-row.already-here{opacity:.4; cursor:default;}
  .rv-row.already-here:hover{background:transparent;}
  .panel-foot{padding:10px 18px; border-top:1px solid var(--sand-200); font-size:11px; color:var(--ink-400);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--aloe-900); color:#fff; padding:9px 16px; border-radius:8px;
    font-size:13px; z-index:30; opacity:0; pointer-events:none;
    transition:opacity .15s ease;
  }
  .toast.show{opacity:1;}
  .toast.error{background:var(--red-600);}
</style>
</head>

const state = {
  data: null,          // { lastUpdated, trades: [...] }
  activeTradeId: null,
  rvVendors: [],
  dirty: false,
  usingSeed: false
};

const el = (sel) => document.querySelector(sel);
const tradeListEl = el('#tradeList');
const cardGrid = el('#cardGrid');
const tradeTitle = el('#tradeTitle');
const tradeSub = el('#tradeSub');
const statusLine = el('#statusLine');

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2)); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function arrToLines(arr){ return (arr||[]).join('\n'); }
function linesToArr(text){ return text.split('\n').map(s=>s.trim()).filter(Boolean); }
function arrToCsv(arr){ return (arr||[]).join(', '); }
function csvToArr(text){ return text.split(',').map(s=>s.trim()).filter(Boolean); }

function slugify(label){
  let s = label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if(!s) s = 'trade';
  let candidate = s, n = 2;
  const existingIds = new Set(state.data.trades.map(t => t.id));
  while(existingIds.has(candidate)){ candidate = s + '_' + n; n++; }
  return candidate;
}

function showToast(msg, isError){
  const t = el('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setStatus(mode){
  const map = {
    saved:   ['All changes saved', ''],
    unsaved: ['Unsaved changes', 'unsaved'],
    saving:  ['Saving…', 'unsaved'],
    error:   ['Save failed — will retry', 'error'],
    seed:    ['Showing 07/16 snapshot — /api/vendors not reachable yet', 'unsaved']
  };
  const [text, cls] = map[mode];
  statusLine.textContent = text;
  statusLine.className = 'status ' + cls;
}

/* ---------------- Load ---------------- */
async function loadVendors(){
  try{
    const res = await fetch('/api/vendors');
    if(!res.ok) throw new Error('bad status ' + res.status);
    const json = await res.json();
    if(!json || !Array.isArray(json.trades)) throw new Error('unexpected shape');
    state.data = json;
    state.usingSeed = false;
  }catch(err){
    console.warn('Could not load /api/vendors — falling back to the 07/16 seed snapshot.', err);
    state.data = deepClone(SEED_DATA);
    state.usingSeed = true;
  }
  state.data.trades.forEach(t => t.vendors.forEach(v => { if(!v.__uid) v.__uid = uid(); }));
  state.activeTradeId = state.data.trades.length ? state.data.trades[0].id : null;
  renderTradeList();
  renderCards();
  if(state.usingSeed) setStatus('seed'); else setStatus('saved');
}

async function loadRentvineVendors(){
  if(state.rvVendors.length) return state.rvVendors;
  try{
    const res = await fetch('/api/rv-vendors');
    if(!res.ok) throw new Error('bad status ' + res.status);
    const rvJson = await res.json();
    state.rvVendors = Array.isArray(rvJson) ? rvJson : (rvJson.vendors || []);
  }catch(err){
    console.warn('Could not load /api/rv-vendors', err);
    showToast('Could not load Rentvine vendors — check /api/rv-vendors', true);
    state.rvVendors = [];
  }
  return state.rvVendors;
}

/* ---------------- Save (debounced, full replace) ---------------- */
let saveTimer = null;
function scheduleSave(){
  state.dirty = true;
  setStatus('unsaved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 700);
}
async function doSave(){
  setStatus('saving');
  const payload = {
    lastUpdated: new Date().toISOString().slice(0,10),
    trades: state.data.trades.map(t => ({
      id: t.id,
      label: t.label,
      vendors: t.vendors.map(v => {
        const { __uid, ...rest } = v;
        return rest;
      })
    }))
  };
  try{
    const res = await fetch('/api/vendors', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('bad status ' + res.status);
    state.dirty = false;
    state.usingSeed = false;
    setStatus('saved');
  }catch(err){
    console.error(err);
    setStatus('error');
    showToast('Save failed — check server.js / /api/vendors', true);
  }
}

/* ---------------- Sidebar ---------------- */
function renderTradeList(){
  tradeListEl.innerHTML = '';
  state.data.trades.forEach(trade => {
    const item = document.createElement('div');
    item.className = 'trade-item' + (trade.id === state.activeTradeId ? ' active' : '');
    item.innerHTML = `<span>${escapeHtml(trade.label)}</span><span class="count">${trade.vendors.length}</span>`;
    item.onclick = () => { state.activeTradeId = trade.id; renderTradeList(); renderCards(); };
    tradeListEl.appendChild(item);
  });
}

el('#addTradeBtn').onclick = () => {
  const label = prompt('New trade category name (e.g. "Fencing"):');
  if(!label || !label.trim()) return;
  const clean = label.trim();
  if(state.data.trades.some(t => t.label.toLowerCase() === clean.toLowerCase())){
    showToast('That trade already exists'); return;
  }
  const trade = { id: slugify(clean), label: clean, vendors: [] };
  state.data.trades.push(trade);
  state.activeTradeId = trade.id;
  renderTradeList();
  renderCards();
  scheduleSave();
};

/* ---------------- Card grid ---------------- */
function getActiveTrade(){
  return state.data.trades.find(t => t.id === state.activeTradeId) || null;
}

function renderCards(){
  const trade = getActiveTrade();
  tradeTitle.textContent = trade ? trade.label : 'No trades yet';
  const vendors = trade ? trade.vendors : [];
  tradeSub.textContent = trade ? `${vendors.length} vendor${vendors.length===1?'':'s'} · sorted by priority` : '';

  cardGrid.innerHTML = '';
  if(!trade){ return; }

  if(vendors.length === 0){
    cardGrid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        No vendors in ${escapeHtml(trade.label)} yet.<br>
        <button class="btn btn-primary" id="emptyAddBtn">+ New vendor</button>
      </div>`;
    el('#emptyAddBtn').onclick = () => addBlankVendor(trade);
    return;
  }

  const sorted = [...vendors].sort((a,b) => (a.priority ?? 99) - (b.priority ?? 99));
  sorted.forEach(v => cardGrid.appendChild(renderCard(v, trade)));
}

function vendorKey(vendor){
  return vendor.rvContactId ? ('rv:'+vendor.rvContactId) : ('nm:'+(vendor.name||'').trim().toLowerCase());
}

function otherTradesFor(vendor){
  const key = vendorKey(vendor);
  if(key === 'nm:') return [];
  const out = [];
  state.data.trades.forEach(trade => {
    if(trade.id === state.activeTradeId) return;
    if(trade.vendors.some(v2 => vendorKey(v2) === key)) out.push(trade.label);
  });
  return out;
}

function renderCard(vendor, trade){
  const card = document.createElement('div');
  card.className = 'card' + (vendor.active === false ? ' inactive' : '');

  const chips = otherTradesFor(vendor);

  card.innerHTML = `
    <div class="card-top">
      <input class="card-name-input" value="${escapeAttr(vendor.name||'')}" placeholder="Vendor name" data-field="name">
      <div class="priority-badge" title="Call priority — 1 = call first">
        #<input type="number" min="1" value="${vendor.priority ?? ''}" data-field="priority">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Contact person</label>
        <input value="${escapeAttr(vendor.contact||'')}" data-field="contact">
      </div>
      <div class="field">
        <label>Phone</label>
        <input class="mono" value="${escapeAttr(vendor.phone||'')}" data-field="phone">
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <input class="mono" value="${escapeAttr(vendor.email||'')}" data-field="email">
    </div>
    <div class="field">
      <label>Zones covered <span class="hint">(comma-separated)</span></label>
      <input value="${escapeAttr(arrToCsv(vendor.zones))}" data-field="zones" data-kind="csv" placeholder="e.g. Maricopa, Valley-wide">
    </div>
    <div class="field">
      <label>Services <span class="hint">(one per line)</span></label>
      <textarea data-field="services" data-kind="lines" placeholder="What they handle">${escapeHtml(arrToLines(vendor.services))}</textarea>
    </div>
    <div class="field">
      <label>Exclusions <span class="hint">(one per line)</span></label>
      <textarea data-field="exclusions" data-kind="lines" placeholder="What they won't do">${escapeHtml(arrToLines(vendor.exclusions))}</textarea>
    </div>
    <div class="field">
      <label>Flags <span class="hint">(comma-separated tags, e.g. last-resort)</span></label>
      <input value="${escapeAttr(arrToCsv(vendor.flags))}" data-field="flags" data-kind="csv" placeholder="e.g. expensive, requires-followup">
      <div class="flag-chips">${(vendor.flags||[]).map(f => `<span class="flag-chip">${escapeHtml(f)}</span>`).join('')}</div>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea data-field="notes" placeholder="Anything Ari should know before calling">${escapeHtml(vendor.notes||'')}</textarea>
    </div>
    <div class="field">
      <label>Rentvine contact ID</label>
      <input class="mono" value="${escapeAttr(vendor.rvContactId||'')}" data-field="rvContactId" placeholder="—">
    </div>

    ${chips.length ? `<div class="trade-chips">
        <span class="trade-chip current">${escapeHtml(trade.label)}</span>
        ${chips.map(c => `<span class="trade-chip">${escapeHtml(c)}</span>`).join('')}
      </div>` : ''}

    <div class="card-foot">
      <label class="active-toggle">
        <input type="checkbox" data-field="active" ${vendor.active !== false ? 'checked' : ''}>
        Active
      </label>
      <button class="btn-ghost btn-danger" data-action="remove">Remove from ${escapeHtml(trade.label)}</button>
    </div>
  `;

  card.querySelectorAll('[data-field]').forEach(input => {
    const field = input.dataset.field;
    const kind = input.dataset.kind;
    const handler = () => {
      let val;
      if(input.type === 'checkbox') val = input.checked;
      else if(input.type === 'number') val = (input.value === '' ? null : Number(input.value));
      else if(kind === 'csv') val = csvToArr(input.value);
      else if(kind === 'lines') val = linesToArr(input.value);
      else val = input.value;

      if(field === 'rvContactId' && val === '') val = undefined;
      if(val === undefined) delete vendor[field]; else vendor[field] = val;

      scheduleSave();
      if(field === 'active') card.classList.toggle('inactive', !vendor.active);
      if(field === 'priority') renderCards(); // re-sort
      if(field === 'flags'){
        card.querySelector('.flag-chips').innerHTML = (vendor.flags||[]).map(f => `<span class="flag-chip">${escapeHtml(f)}</span>`).join('');
      }
      if(field === 'rvContactId' || field === 'name'){
        const newChips = otherTradesFor(vendor);
        const existing = card.querySelector('.trade-chips');
        if(existing) existing.remove();
        if(newChips.length){
          const div = document.createElement('div');
          div.className = 'trade-chips';
          div.innerHTML = `<span class="trade-chip current">${escapeHtml(trade.label)}</span>` +
            newChips.map(c => `<span class="trade-chip">${escapeHtml(c)}</span>`).join('');
          card.querySelector('.card-foot').before(div);
        }
      }
    };
    input.addEventListener('input', handler);
    input.addEventListener('change', handler);
  });

  card.querySelector('[data-action="remove"]').onclick = () => {
    if(!confirm(`Remove ${vendor.name || 'this vendor'} from ${trade.label}? (Doesn't affect other trades they're listed under.)`)) return;
    trade.vendors = trade.vendors.filter(v => v.__uid !== vendor.__uid);
    renderTradeList();
    renderCards();
    scheduleSave();
  };

  return card;
}

function addBlankVendor(trade){
  const v = { __uid: uid(), name:'', contact:'', phone:'', email:'', priority: (trade.vendors.length + 1), zones:[], services:[], exclusions:[], notes:'', flags:[], active:true };
  trade.vendors.push(v);
  renderTradeList();
  renderCards();
  scheduleSave();
}
el('#newVendorBtn').onclick = () => { const t = getActiveTrade(); if(t) addBlankVendor(t); };

/* ---------------- Import from Rentvine panel ---------------- */
const overlay = el('#overlay');
const panel = el('#importPanel');

function openPanel(){
  const trade = getActiveTrade();
  if(!trade){ showToast('Pick or create a trade first'); return; }
  el('#rvTargetTrade').textContent = trade.label;
  overlay.classList.add('open');
  panel.classList.add('open');
  loadRentvineVendors().then(renderRvList);
}
function closePanel(){
  overlay.classList.remove('open');
  panel.classList.remove('open');
}
el('#importBtn').onclick = openPanel;
el('#closePanel').onclick = closePanel;
overlay.onclick = closePanel;

function currentTradeHasRvId(rvId){
  const trade = getActiveTrade();
  return !!(trade && trade.vendors.some(v => v.rvContactId === String(rvId)));
}

function renderRvList(filter){
  const list = el('#rvList');
  const q = (filter || el('#rvSearch').value || '').toLowerCase().trim();
  const filtered = state.rvVendors.filter(v =>
    !q || (v.name||'').toLowerCase().includes(q) || (v.phone||'').includes(q) || (v.email||'').toLowerCase().includes(q)
  );
  list.innerHTML = '';
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state">No matches.</div>`;
    return;
  }
  const trade = getActiveTrade();
  filtered.forEach(rv => {
    const already = currentTradeHasRvId(rv.id);
    const row = document.createElement('div');
    row.className = 'rv-row' + (already ? ' already-here' : '');
    row.innerHTML = `
      <span class="name">${escapeHtml(rv.name||'(no name)')}</span>
      <span class="meta">${escapeHtml(rv.phone||'')}${rv.phone && rv.email ? ' · ' : ''}${escapeHtml(rv.email||'')}${already ? ' · already in ' + escapeHtml(trade.label) : ''}</span>
    `;
    if(!already){
      row.onclick = () => importVendor(rv);
    }
    list.appendChild(row);
  });
}
el('#rvSearch').addEventListener('input', () => renderRvList());

function importVendor(rv){
  const trade = getActiveTrade();
  if(!trade) return;
  if(currentTradeHasRvId(rv.id)){
    showToast('Already in ' + trade.label);
    return;
  }
  const v = {
    __uid: uid(),
    name: rv.name || '',
    contact: rv.contact || '',
    phone: rv.phone || '',
    email: rv.email || '',
    priority: (trade.vendors.length + 1),
    zones: [], services: [], exclusions: [], notes: '', flags: [],
    active: true,
    rvContactId: String(rv.id)
  };
  trade.vendors.push(v);
  renderTradeList();
  renderCards();
  renderRvList();
  scheduleSave();
  showToast(`${v.name || 'Vendor'} added to ${trade.label}`);
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- init ---------------- */
loadVendors();
</script>
<script src="/hub-shell.js" defer></script>
</body>
</html>
