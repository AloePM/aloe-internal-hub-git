    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --teal:#3CC3E1;
      --teal-dark:#4BB4D2;
      --teal-dim:rgba(60,195,225,0.12);
      --teal-dim2:rgba(60,195,225,0.06);
      --teal-border:rgba(60,195,225,0.25);
      --silver:#B4C3C3;
      --silver-dim:rgba(180,195,195,0.15);
      --bg:#F8FAFC;
      --bg2:#ffffff;
      --bg3:#f1f5f5;
      --border:rgba(180,195,195,0.3);
      --border2:rgba(60,195,225,0.25);
      --text:#1a2b2b;
      --text2:#4a6060;
      --text3:#8aa0a0;
      --green-dark:#173404;
      --green-mid:#3B6D11;
      --green-light:#EAF3DE;
      --green-border:#97C459;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    @keyframes pulse{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-4px);opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    textarea:focus,input:focus{outline:none}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--silver-dim);border-radius:2px}
    ::-webkit-scrollbar-track{background:transparent}
  </style>
</head>
<body>

function Logo() {
  return React.createElement('svg',{width:18,height:18,viewBox:"0 0 24 24",fill:"none",xmlns:"http://www.w3.org/2000/svg"},

    React.createElement('path',{d:"M12 3C8 3 5 7 5 11c0 5 7 10 7 10s7-5 7-10c0-4-3-8-7-8z",stroke:"#3CC3E1",strokeWidth:"1.5",fill:"none"}),
    React.createElement('path',{d:"M12 8v6M9 11h6",stroke:"#3CC3E1",strokeWidth:"1.5",strokeLinecap:"round"})

function renderMd(text) {
  if (!text) return null;
  const bold = s => s.split(/\*\*(.*?)\*\*/).map((p,i)=>
    i%2===1?React.createElement('strong',{key:i,style:{fontWeight:600,color:"var(--text)"}},p):p
  );
  return text.split("\n").map((line,key)=>{
    if (!line.trim()) return React.createElement('div',{key,style:{height:6}});
    if (line.match(/^#{1,3}\s/)) return React.createElement('p',{key,style:{fontWeight:600,color:"var(--text)",marginBottom:4,marginTop:10,fontSize:13}},bold(line.replace(/^#+\s/,"")));
    if (line.match(/^[-•]\s/)) return React.createElement('div',{key,style:{display:"flex",gap:8,marginBottom:4}},
      React.createElement('span',{style:{color:"var(--teal)",flexShrink:0,marginTop:1}},"•"),
      React.createElement('span',null,bold(line.replace(/^[-•]\s/,"")))
    );
    if (line.match(/^\d+\.\s/)) return React.createElement('div',{key,style:{display:"flex",gap:8,marginBottom:4}},
      React.createElement('span',{style:{color:"var(--teal)",flexShrink:0,minWidth:16,fontWeight:600}},line.match(/^(\d+)/)[1]+"."),
      React.createElement('span',null,bold(line.replace(/^\d+\.\s/,"")))
    );
    return React.createElement('p',{key,style:{marginBottom:3,lineHeight:1.65}},bold(line));
  });
}

function PasscodeGate({onUnlock}) {
  const [val,setVal]=useState("");

  const [shaking,setShaking]=useState(false);

  useEffect(()=>{ref.current?.focus();},[]);

    if(val===PASSCODE){onUnlock();}
    else{setError(true);setShaking(true);setVal("");setTimeout(()=>setShaking(false),500);}

    background:"var(--bg)",

            React.createElement('path',{d:"M12 3C8 3 5 7 5 11c0 5 7 10 7 10s7-5 7-10c0-4-3-8-7-8z",stroke:"#3CC3E1",strokeWidth:"1.5",fill:"none"}),

        React.createElement('p',{style:{fontSize:13,color:"var(--text2)",marginBottom:12,textAlign:"center"}},"Enter your team passcode"),
        React.createElement('input',{
          ref,type:"password",value:val,
          onChange:e=>{setVal(e.target.value);setError(false);},
          onKeyDown:e=>e.key==="Enter"&&attempt(),
          placeholder:"Passcode",
          style:{
            width:"100%",fontSize:15,padding:"10px 14px",textAlign:"center",

}

function Assistant() {
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [sidebar,setSidebar]=useState(true);
  const endRef=useRef(null);
  const taRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  const send=async(text)=>{
    const msg=(text||input).trim();
    if(!msg||loading)return;
    setInput("");setError("");
    if(taRef.current)taRef.current.style.height="auto";
    const next=[...messages,{role:"user",content:msg}];
    setMessages(next);setLoading(true);
    try{
      const res=await fetch('/api/chat',{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:next.map(m=>({role:m.role,content:m.content}))})
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")||"Sorry, try again.";
      setMessages([...next,{role:"assistant",content:txt}]);
    }catch(e){
      setError(e.message);
      setMessages([...next,{role:"assistant",content:"Something went wrong — see error above."}]);
    }
    setLoading(false);
  };

  const clearChat=()=>{setMessages([]);setError("");};

  return React.createElement('div',{style:{display:"flex",height:"100vh",overflow:"hidden",background:"var(--bg)"}},
    sidebar&&React.createElement(Sidebar,{send}),
    React.createElement('div',{style:{flex:1,display:"flex",flexDirection:"column",minWidth:0}},

      // Error bar
      error&&React.createElement('div',{style:{
        padding:"8px 16px",
        background:"rgba(248,113,113,0.08)",
        borderBottom:"1px solid rgba(248,113,113,0.2)",
        display:"flex",justifyContent:"space-between",flexShrink:0,
      }},
        React.createElement('span',{style:{fontSize:12,color:"#f87171"}},`⚠ ${error}`),
        React.createElement('button',{onClick:()=>setError(""),style:{background:"none",border:"none",cursor:"pointer",color:"#f87171",fontSize:16}},"×")
      ),

      // Top bar
      React.createElement('div',{style:{
        display:"flex",alignItems:"center",
        padding:"10px 16px",
        background:"var(--bg2)",
        borderBottom:"1px solid var(--border)",
        flexShrink:0,gap:10,
      }},
        React.createElement('button',{
          onClick:()=>setSidebar(!sidebar),
          style:{
            width:32,height:32,borderRadius:8,
            border:"1px solid var(--border)",
            background:"var(--bg2)",cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:14,flexShrink:0,color:"var(--text2)",
            transition:"all 0.15s",
          },
          title:sidebar?"Hide sidebar":"Show sidebar"
        },"☰"),
        React.createElement('div',{style:{
          display:"flex",alignItems:"center",gap:8,flex:1,
        }},
          React.createElement('div',{style:{
            width:26,height:26,borderRadius:7,
            background:"var(--teal-dim)",
            border:"1px solid var(--teal-border)",
            display:"flex",alignItems:"center",justifyContent:"center",
          }},React.createElement(Logo)),
          React.createElement('span',{style:{fontSize:14,fontWeight:700,color:"var(--text)",letterSpacing:"-0.2px"}},
            "Aloe Assistant"
          ),
          React.createElement('span',{style:{
            fontSize:10,fontWeight:500,
            padding:"2px 8px",borderRadius:20,
            background:"var(--teal-dim)",
            color:"var(--teal-dark)",
            border:"1px solid var(--teal-border)",
          }},"AI · Live data")
        ),
        messages.length>0&&React.createElement('button',{
          onClick:clearChat,
          style:{
            fontSize:11,color:"var(--text3)",
            background:"none",
            border:"1px solid var(--border)",
            borderRadius:7,padding:"4px 10px",
            cursor:"pointer",transition:"all 0.15s",
          },
          onMouseOver:e=>{e.currentTarget.style.borderColor="var(--teal)";e.currentTarget.style.color="var(--teal-dark)";},

        },"New chat"),

      ),

      }},
        messages.length===0
          ? React.createElement('div',{style:{

            }},

                  React.createElement('path',{d:"M12 3C8 3 5 7 5 11c0 5 7 10 7 10s7-5 7-10c0-4-3-8-7-8z",fill:"#3CC3E1",opacity:"0.3"}),
                  React.createElement('path',{d:"M12 3C8 3 5 7 5 11c0 5 7 10 7 10s7-5 7-10c0-4-3-8-7-8z",stroke:"#3CC3E1",strokeWidth:"1.5",fill:"none"}),
                  React.createElement('path',{d:"M12 8v6M9 11h6",stroke:"#3CC3E1",strokeWidth:"1.5",strokeLinecap:"round"})
                )
              ),
              React.createElement('div',{style:{fontSize:20,fontWeight:700,color:"var(--text)",letterSpacing:"-0.4px",marginBottom:8}},"Hi, I'm Aloe"),
              React.createElement('div',{style:{fontSize:13,color:"var(--text2)",lineHeight:1.7,maxWidth:380,margin:"0 auto"}},"Your AI assistant for Aloe Property Management. Pick a shortcut from the sidebar or type any question below."),
              React.createElement('div',{style:{
                display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",marginTop:24,
              }},
                ["Work orders","Available units","Lease break policy","New leads this week"].map(s=>
                  React.createElement('button',{
                    key:s,onClick:()=>send(s),
                    style:{
                      fontSize:12,padding:"7px 14px",
                      borderRadius:20,
                      background:"var(--bg2)",
                      border:"1px solid var(--border)",
                      color:"var(--text2)",cursor:"pointer",
                      transition:"all 0.15s",
                    },
                    onMouseOver:e=>{e.currentTarget.style.borderColor="var(--teal)";e.currentTarget.style.color="var(--teal-dark)";e.currentTarget.style.background="var(--teal-dim)";},
                    onMouseOut:e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--text2)";e.currentTarget.style.background="var(--bg2)";},
                  },s)
                )
              )
            )
          : React.createElement('div',{style:{maxWidth:700,width:"100%",margin:"0 auto"}},
              messages.map((m,i)=>
                React.createElement('div',{
                  key:i,
                  style:{
                    display:"flex",
                    justifyContent:m.role==="user"?"flex-end":"flex-start",
                    marginBottom:14,
                    alignItems:"flex-start",gap:8,
                  }
                },
                  m.role==="assistant"&&React.createElement('div',{style:{
                    width:28,height:28,borderRadius:8,flexShrink:0,marginTop:2,
                    background:"var(--teal-dim)",
                    border:"1px solid var(--teal-border)",
                    display:"flex",alignItems:"center",justifyContent:"center",
                  }},React.createElement(Logo)),
                  React.createElement('div',{style:{
                    maxWidth:"78%",
                    padding:"10px 14px",
                    borderRadius:m.role==="user"?"12px 12px 4px 12px":"12px 12px 12px 4px",
                    background:m.role==="user"?"var(--teal-dim)":"var(--bg2)",
                    border:`1px solid ${m.role==="user"?"var(--teal-border)":"var(--border)"}`,
                    color:"var(--text)",
                    fontSize:13,lineHeight:1.65,
                  }},
                    m.role==="assistant"?renderMd(m.content):m.content
                  )
                )
              ),
              loading&&React.createElement('div',{style:{display:"flex",alignItems:"flex-start",gap:8,marginBottom:14}},
                React.createElement('div',{style:{
                  width:28,height:28,borderRadius:8,flexShrink:0,
                  background:"var(--teal-dim)",
                  border:"1px solid var(--teal-border)",
                  display:"flex",alignItems:"center",justifyContent:"center",
                }},React.createElement(Logo)),
                React.createElement('div',{style:{
                  padding:"12px 16px",
                  background:"var(--bg2)",
                  border:"1px solid var(--border)",
                  borderRadius:"12px 12px 12px 4px",
                }},React.createElement(Dots))
              ),
              React.createElement('div',{ref:endRef})
            )
      ),

      // Input area
      React.createElement('div',{style:{
        padding:"12px 20px 16px",
        background:"var(--bg2)",
        borderTop:"1px solid var(--border)",
        flexShrink:0,
      }},
        React.createElement('div',{style:{
          maxWidth:700,margin:"0 auto",
          display:"flex",gap:8,alignItems:"flex-end",
          background:"var(--bg3)",
          border:"1.5px solid var(--border)",
          borderRadius:12,padding:"6px 6px 6px 14px",
          transition:"border-color 0.15s",
        }},
          React.createElement('textarea',{
            ref:taRef,value:input,
            onChange:e=>{
              setInput(e.target.value);
              e.target.style.height="auto";
              e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";
            },
            onKeyDown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}},
            placeholder:"Ask anything about properties, tenants, work orders, leases…",
            rows:1,
            style:{
              flex:1,padding:"6px 0",
              background:"transparent",
              border:"none",
              color:"var(--text)",
              fontSize:13,fontFamily:"inherit",
              resize:"none",lineHeight:1.5,
              minHeight:32,maxHeight:120,
            }
          }),
          React.createElement('button',{
            onClick:()=>send(),
            disabled:!input.trim()||loading,
            style:{
              width:34,height:34,borderRadius:8,flexShrink:0,
              background:input.trim()&&!loading?"var(--teal)":"var(--border)",
              border:"none",
              cursor:input.trim()&&!loading?"pointer":"default",
              color:"white",fontSize:15,
              display:"flex",alignItems:"center",justifyContent:"center",
              transition:"background 0.15s",
            }
          },"↑")
        ),
        React.createElement('div',{style:{
          textAlign:"center",fontSize:11,color:"var(--text3)",marginTop:8,
        }},"Rentvine · Aptly · Knowledge Base · Slack · All data is live")
      )
    )
  );
}

function App() {
  const [unlocked,setUnlocked]=useState(false);
  return unlocked?React.createElement(Assistant):React.createElement(PasscodeGate,{onUnlock:()=>setUnlocked(true)});
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
<script src="/hub-shell.js" defer></script>
</body>
</html>
