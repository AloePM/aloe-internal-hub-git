<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aloe Hub - Move-outs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#3CC3E1;--teal2:#2aa8c4;--teal-dim:rgba(60,195,225,0.08);
  --silver:#B4C3C3;--ink:#0d1a1a;--ink2:#243030;--ink3:#3a5050;
  --muted:#4A6466;--ghost:#6b8585;--rule:rgba(180,200,200,0.35);
  --bg:#F8FAFC;--card:#ffffff;--card2:#f9fbfb;
  --green:#0fa86c;--green-d:#dcf5ec;
  --red:#e03e3e;--red-d:#fde8e8;
  --amber:#d4820a;--amber-d:#fef3dc;
  --blue:#2563eb;--blue-d:#dbeafe;
  --purple:#7c3aed;--purple-d:#ede9fe;
  --r:12px;--r2:8px;
}
body{background:var(--bg);color:#1B2B2E;font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;font-size:14px;line-height:1.5}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:28px 28px 0;max-width:1400px;margin:0 auto}
h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.sub{margin-top:6px;color:var(--muted);font-size:14px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace}
.btn{min-height:44px;padding:0 18px;border-radius:10px;font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn-line{border:1px solid #B4C3C3;background:#fff;color:#0A5468}
.btn-line:hover:not(:disabled){background:#E6EFF0}
.btn:focus-visible,.tab:focus-visible{outline:2px solid #2A8FA6;outline-offset:2px}
.nav{display:flex;gap:2px;max-width:1400px;margin:14px auto 0;padding:0 28px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{padding:12px 16px;min-height:44px;font:600 14px Manrope,system-ui,sans-serif;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:#0A5468;border-bottom-color:var(--teal);font-weight:800}
.tab:hover:not(.active){color:var(--ink2)}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;gap:16px}
.spinner{width:32px;height:32px;border:2px solid var(--rule);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}
.error-wrap{margin:24px 28px;padding:14px 18px;background:var(--red-d);border:1px solid #fca5a5;border-radius:var(--r2);color:#b91c1c;font-size:13px}
.main{padding:24px 28px;max-width:1400px;margin:0 auto}
.kpi-grid{display:grid;gap:10px;margin-bottom:16px}
.kpi-grid.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.kpi-value{font-size:30px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-0.03em}
.kpi-sub{font-size:11px;color:var(--ghost);margin-top:5px;font-family:'DM Mono',monospace}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.card-title-bar{width:3px;height:13px;border-radius:2px;flex-shrink:0}
.trend-section-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.trend-section-label::after{content:'';flex:1;height:1px;background:var(--rule)}
#panes thead tr{background:#E6EFF0!important;color:#4A6466!important}
.pl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
.pl-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
.pl-tbl th{background:#E6EFF0;color:#4A6466;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;white-space:nowrap}
.pl-tbl td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top}
.pl-addr{font-weight:700;color:var(--ink)}
.pl-small{font-size:12px;color:var(--muted)}
.pl-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;background:var(--amber-d);color:#8a5200}
.pl-pill.red{background:var(--red-d);color:#b91c1c}
.pl-days{font-family:'DM Mono',monospace;font-weight:500}
.pl-days.warn{color:var(--amber);font-weight:700}
.pl-days.bad{color:var(--red);font-weight:700}
.pl-note{margin:0 0 12px;color:var(--muted);font-size:13px}
.pl-empty{padding:24px;color:var(--muted)}
.rp-btn{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid #B4C3C3;background:#fff;color:#0A5468;font:700 12px Manrope,system-ui,sans-serif;cursor:pointer;text-align:left}
.rp-btn:hover{background:#E6EFF0}
.rp-back{position:fixed;inset:0;background:rgba(13,26,26,.45);z-index:20000;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.rp-dlg{background:#fff;border-radius:14px;max-width:1040px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.rp-dlg h2{font-size:20px;font-weight:800;margin-bottom:4px}
.rp-grid{overflow-x:auto;margin:14px 0}
.rp-tbl{width:100%;border-collapse:collapse;min-width:900px;font-size:13px}
.rp-tbl th{background:#E6EFF0;color:#4A6466;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px}
.rp-tbl td{padding:6px 4px;border-top:1px solid var(--rule);vertical-align:top}
.rp-tbl input,.rp-tbl select,.rp-ed input{width:100%;min-height:44px;padding:0 8px;border:1px solid #B4C3C3;border-radius:8px;font:500 13px Manrope,system-ui,sans-serif;background:#fff;color:var(--ink)}
.rp-tbl input:focus,.rp-tbl select:focus,.rp-ed input:focus{outline:2px solid #2A8FA6;outline-offset:1px}
.rp-tot{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.rp-tot div{background:var(--card2);border:1px solid var(--rule);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--muted)}
.rp-tot b{display:block;font-size:18px;color:var(--ink)}
.rp-msg{margin:10px 0;padding:10px 14px;border-radius:8px;font-size:13px}
.rp-msg.err{background:var(--red-d);color:#b91c1c}
.rp-msg.ok{background:var(--green-d);color:#0b6b46}
.rp-ed{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-top:6px}
.rp-ed label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.rp-ed .f{flex:1;min-width:180px;max-width:260px}
@media(max-width:900px){
  .kpi-grid.g4{grid-template-columns:repeat(2,1fr)}
  .main{padding:16px}
  .top{padding:68px 16px 0}
  .nav{padding:0 16px}
}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Move-outs</h1>
    <p class="sub">Active move-out processing, disposition tracking and charge reconciliation.</p>
  </div>
  <div class="actions">
    <span class="live" id="live-time" role="status" aria-live="polite"></span>
    <button class="btn btn-line" id="refresh-btn" type="button">Refresh</button>
    <button class="btn btn-line" id="force-btn" type="button">Live Refresh</button>
  </div>
</header>

<div class="nav" role="tablist" aria-label="Move-out sections">
  <button class="tab active" role="tab" id="tab-main" data-tab="main" aria-selected="true" type="button">Move-outs</button>
  <button class="tab" role="tab" id="tab-pipeline" data-tab="pipeline" aria-selected="false" type="button">Pipeline</button>
  <button class="tab" role="tab" id="tab-turns" data-tab="turns" aria-selected="false" type="button">Unit turns</button>
  <button class="tab" role="tab" id="tab-recon" data-tab="recon" aria-selected="false" type="button">Charge reconciliation</button>
</div>

<div id="loading" class="loading-wrap"><div class="spinner"></div><div class="loading-text">Loading data from Rentvine…</div></div>
<div id="error" class="error-wrap" role="alert" style="display:none"></div>
<div id="panes" style="display:none">
  <div id="pane-main" role="tabpanel" aria-labelledby="tab-main"></div>
  <div id="pane-pipeline" role="tabpanel" aria-labelledby="tab-pipeline" style="display:none"></div>
  <div id="pane-turns" role="tabpanel" aria-labelledby="tab-turns" style="display:none"></div>
  <div id="pane-recon" role="tabpanel" aria-labelledby="tab-recon" style="display:none"></div>
</div>

<script>
var C = {
  TEAL:'#3CC3E1', TEAL2:'#2aa8c4',
  GREEN:'#0fa86c', RED:'#e03e3e',
  AMBER:'#d4820a', BLUE:'#2563eb',
  PURPLE:'#7c3aed', GRAY:'#94acac'
};


function fmt(n, pre, suf) {
  pre = pre || '';
  suf = suf || '';
  if (n == null) return '--';
  return pre + Number(n).toLocaleString() + suf;
}


function kpi(label, value, sub, color) {
  return '<div class="kpi"><div class="kpi-accent" style="background:'+color+'"></div>' +
    '<div class="kpi-label">'+label+'</div>' +
    '<div class="kpi-value">'+(value != null ? value : '--')+'</div>' +
    (sub ? '<div class="kpi-sub">'+sub+'</div>' : '') +
    '</div>';
}


function renderMoveOuts() {
  var l = D.leases || {};
  var allMoveOuts = l.moveOutsDetail || [];
  var today = new Date(); today.setHours(0,0,0,0);
  var in30 = new Date(); in30.setDate(in30.getDate()+30);
  var d30ago = new Date(); d30ago.setDate(d30ago.getDate()-30);
  var upcomingMoveOuts = allMoveOuts.filter(function(m){
    if (!m.moveOutDate) return false;
    var d = new Date(m.moveOutDate); d.setHours(0,0,0,0);
    return d > today;
  }).sort(function(a,b){ return (a.moveOutDate||'').localeCompare(b.moveOutDate||''); });
  var accountingMoveOuts = allMoveOuts.filter(function(m){
    if (!m.moveOutDate) return false;
    var d = new Date(m.moveOutDate); d.setHours(0,0,0,0);
    return d >= today && d <= in30;
  }).sort(function(a,b){ return (a.moveOutDate||'').localeCompare(b.moveOutDate||''); });
  var recentMoveOuts = allMoveOuts.filter(function(m){
    if (!m.moveOutDate) return false;
    var d = new Date(m.moveOutDate); d.setHours(0,0,0,0);
    return d >= d30ago && d <= today;
  });
  var overdueCount = recentMoveOuts.filter(function(m){ return m.stage !== 'Complete'; }).length;

  var html = '<div class="main">';
  html += '<div class="kpi-grid g4">';
  html += kpi('Total Active', fmt(allMoveOuts.length), 'in pipeline', C.AMBER);
  html += kpi('Upcoming', fmt(upcomingMoveOuts.length), 'not yet vacated', C.BLUE);
  html += kpi('Recent (30 days)', fmt(recentMoveOuts.length), 'move-outs', C.TEAL2);
  html += kpi('Overdue Disposition', fmt(overdueCount), 'past 30 days, not complete', overdueCount > 0 ? C.RED : C.GREEN);
  html += '</div>';

  // Upcoming Move-Outs
  html += '<div class="trend-section-label" style="margin-top:4px">Upcoming Move-Outs — Not Yet Vacated</div>';
  if (!upcomingMoveOuts.length) {
    html += '<div class="card"><div style="color:var(--ghost);font-size:13px">No upcoming move-outs.</div></div>';
  } else {
    html += '<div class="card"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
    html += '<thead><tr style="background:var(--ink);color:rgba(255,255,255,0.6);font-size:10px;text-transform:uppercase;letter-spacing:.06em">';
    html += '<th style="padding:6px 12px">Property</th>';
    html += '<th style="padding:6px 12px;text-align:center">Type</th>';
    html += '<th style="padding:6px 12px;text-align:center">Expected Move-Out</th>';
    html += '<th style="padding:6px 12px;text-align:center">Days Until</th>';
    html += '<th style="padding:6px 12px;text-align:center">Stage</th>';
    html += '</tr></thead><tbody>';
    upcomingMoveOuts.forEach(function(m, i) {
      var d = new Date(m.moveOutDate); d.setHours(0,0,0,0);
      var daysUntil = Math.ceil((d - today) / 86400000);
      var daysBg = daysUntil <= 7 ? 'var(--red-d)' : daysUntil <= 14 ? 'var(--amber-d)' : 'var(--blue-d)';
      var daysColor = daysUntil <= 7 ? 'var(--red)' : daysUntil <= 14 ? 'var(--amber)' : 'var(--blue)';
      var typeBg = m.moveOutType === 'Eviction' ? 'var(--red-d)' : m.moveOutType === 'Lease Break' ? 'var(--purple-d)' : 'var(--teal-dim)';
      var typeColor = m.moveOutType === 'Eviction' ? 'var(--red)' : m.moveOutType === 'Lease Break' ? 'var(--purple)' : 'var(--teal2)';
      html += '<tr style="border-bottom:1px solid var(--rule)' + (i%2===1?';background:var(--card2)':'') + '">';
      html += '<td style="padding:8px 12px;font-weight:500">' + (m.address||'--') + '</td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:' + typeBg + ';color:' + typeColor + ';font-weight:600">' + (m.moveOutType||'Standard') + '</span></td>';
      html += '<td style="padding:8px 12px;text-align:center;font-size:11px">' + (m.moveOutDate?m.moveOutDate.slice(0,10):'--') + '</td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:' + daysBg + ';color:' + daysColor + '">' + daysUntil + 'd</span></td>';
      html += '<td style="padding:8px 12px;text-align:center;font-size:11px;color:var(--muted)">' + (m.stage||'--') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  }

  // Accounting checklist - next 30 days
  if (accountingMoveOuts.length) {
    html += '<div class="trend-section-label" style="margin-top:20px">Accounting — Move-Out Distribution Review</div>';
    html += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Review before distributing owner funds · Day 1-19 move-out = Prorated mgmt fee · Day 20+ = Full Month</div>';
    html += '<div class="card" style="margin-bottom:14px"><div class="card-header">';
    html += '<div class="card-title"><div class="card-title-bar" style="background:'+C.AMBER+'"></div>Move-Out Accounting Checklist</div>';
    html += '<span style="font-size:11px;font-weight:700;padding:2px 9px;background:var(--amber-d);color:var(--amber);border-radius:20px">'+accountingMoveOuts.length+' properties</span></div>';
    html += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
    html += '<thead><tr style="background:var(--ink);color:rgba(255,255,255,0.6);font-size:10px;text-transform:uppercase;letter-spacing:.06em">';
    html += '<th style="padding:6px 12px">Property / Owner</th>';
    html += '<th style="padding:6px 12px;text-align:center">Move-Out</th>';
    html += '<th style="padding:6px 12px;text-align:center">Type</th>';
    html += '<th style="padding:6px 12px;text-align:center">Mgmt Fee</th>';
    html += '<th style="padding:6px 12px;text-align:right">Security Dep (2100)</th>';
    html += '<th style="padding:6px 12px;text-align:center">Held By</th>';
    html += '<th style="padding:6px 12px;text-align:right">Tenant Balance</th>';
    html += '<th style="padding:6px 12px;text-align:center">Distribution</th>';
    html += '<th style="padding:6px 12px;text-align:center">Comp. Insp.</th>';
    html += '<th style="padding:6px 12px">Action Needed</th>';
    html += '</tr></thead><tbody>';
    accountingMoveOuts.forEach(function(m, i) {
      var moDate = m.moveOutDate ? m.moveOutDate.slice(0,10) : '--';
      // Mgmt fee badge: move-out day 1-19 = Full Month, 20+ = Prorated
      var feeType = m.mgmtFeeType || (m.moveOutDate ? (new Date(m.moveOutDate).getDate() < 20 ? 'Prorated' : 'Full Month') : '--');
      var feeBg = feeType === 'Prorated' ? 'var(--amber-d)' : 'var(--green-d)';
      var feeColor = feeType === 'Prorated' ? 'var(--amber)' : 'var(--green)';
      // Deposit
      var deposit = m.depositAmount > 0 ? '$' + Number(m.depositAmount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '--';
      var depositColor = m.depositAmount > 0 ? 'var(--blue)' : 'var(--muted)';
      // Held By
      var heldBy = m.depositAmount > 0 ? 'Aloe (2100)' : 'None/Owner';
      var heldByBg = m.depositAmount > 0 ? 'var(--blue-d)' : 'var(--card2)';
      var heldByColor = m.depositAmount > 0 ? 'var(--blue)' : 'var(--muted)';
      // Tenant balance
      var balance = m.tenantBalance != null && m.tenantBalance !== 0 ? '$' + Number(Math.abs(m.tenantBalance)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '$0.00';
      var balanceColor = m.tenantBalance > 0 ? 'var(--red)' : 'var(--green)';
      // Distribution: Hold if deposit > 0 AND tenant has balance OR repairs pending
      var canDistribute = m.depositAmount <= 0 || (m.tenantBalance <= 0 && m.stage === 'Complete');
      var distBg = canDistribute ? 'var(--green-d)' : 'var(--red-d)';
      var distColor = canDistribute ? 'var(--green)' : 'var(--red)';
      var distLabel = canDistribute ? 'OK to Distribute' : 'Hold';
      // Comp inspection
      var compInsp = m.comprehensiveInspection;
      var compBg = compInsp === true || compInsp === 'Yes' || compInsp === 'yes' ? 'var(--green-d)' : 'var(--card2)';
      var compColor = compInsp === true || compInsp === 'Yes' || compInsp === 'yes' ? 'var(--green)' : 'var(--muted)';
      var compLabel = compInsp === true || compInsp === 'Yes' || compInsp === 'yes' ? 'Yes' : 'No';
      // Move-out type badge
      var typeBg = m.moveOutType === 'Eviction' ? 'var(--red-d)' : m.moveOutType === 'Lease Break' ? 'var(--amber-d)' : 'var(--teal-dim)';
      var typeColor = m.moveOutType === 'Eviction' ? 'var(--red)' : m.moveOutType === 'Lease Break' ? 'var(--amber)' : 'var(--teal2)';
      // Action needed
      var actions = [];
      if (!canDistribute) actions.push('Hold distribution');
      if (m.depositAmount > 0 && m.tenantBalance > 0) actions.push('Tenant owes $' + Number(m.tenantBalance).toLocaleString());
      if (m.stage !== 'Complete') actions.push('Stage: ' + (m.stage||'--'));
      if (!m.forwardingAddress) actions.push('No fwd address');
      var actionHtml = actions.length ? actions.map(function(a){ return '<div style="font-size:10px;color:var(--amber)">&#9679; '+a+'</div>'; }).join('') : '<span style="font-size:10px;color:var(--green)">&#10003; Ready</span>';
      html += '<tr style="border-bottom:1px solid var(--rule)' + (i%2===1?';background:var(--card2)':'') + '">';
      html += '<td style="padding:8px 12px"><div style="font-weight:500">' + (m.address||'--') + '</div><div style="font-size:10px;color:var(--muted)">' + (m.owners||'') + '</div></td>';
      html += '<td style="padding:8px 12px;text-align:center;font-size:11px;color:var(--muted)">' + moDate + '</td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:'+typeBg+';color:'+typeColor+';font-weight:600">' + (m.moveOutType||'Standard') + '</span></td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:'+feeBg+';color:'+feeColor+';font-weight:600">' + feeType + '</span></td>';
      html += '<td style="padding:8px 12px;text-align:right;font-weight:700;color:'+depositColor+'">' + deposit + '</td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:'+heldByBg+';color:'+heldByColor+';font-weight:600">' + heldBy + '</span></td>';
      html += '<td style="padding:8px 12px;text-align:right;font-weight:700;color:'+balanceColor+'">' + balance + '</td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:'+distBg+';color:'+distColor+';font-weight:600">' + distLabel + '</span></td>';
      html += '<td style="padding:8px 12px;text-align:center"><span style="font-size:10px;padding:2px 8px;border-radius:20px;background:'+compBg+';color:'+compColor+';font-weight:600">' + compLabel + '</span></td>';
      html += '<td style="padding:8px 12px">' + actionHtml + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  }

  html += '</div>';
  document.getElementById('pane-main').innerHTML = html;
  document.getElementById('pane-recon').innerHTML = '<div class="main"><div id="recon-section"></div><div id="recon-upcoming-section"></div></div>';
  function showReconError(msg) {
    var el = document.getElementById('recon-section');
    if (el) el.innerHTML = '<div class="error-wrap" style="margin:0">Could not load the charge reconciliation (' + String(msg).replace(/</g,'&lt;') + '). Press Refresh to try again.</div>';
  }

    + kpi('Units in turn', turns.length, 'Disposition sent, work not done', '#7c3aed')
    + kpi('Open 14+ days', stuck.length, 'Longest first below', stuck.length ? '#e03e3e' : '#0fa86c')
    + kpi('Longest open', turns.length ? Math.max.apply(null, turns.map(function (c) { return c.daysInStage || 0; })) + ' d' : '—', 'Days in current stage', '#d4820a')
    + kpi('Nobody assigned', turns.filter(function (c) { return !c.assigned; }).length, 'In turn stages', '#3CC3E1')
    + '</div><p class="pl-note">Cards in “Disposition sent- Repairs still in progress” and “Complete Repairs and Bills”, longest first. Turn steps and showing status will be added next.</p>';
  turns = turns.slice().sort(function (a, b) { return (b.daysInStage || 0) - (a.daysInStage || 0); });
  if (!turns.length) th += '<div class="pl-wrap"><div class="pl-empty">No units in turn right now.</div></div>';
  else {
    th += '<div class="pl-wrap"><table class="pl-tbl"><thead><tr><th>Property</th><th>Stage</th><th>In stage</th><th>Moved out</th><th>Turn items needed</th><th>Open checklist</th><th>Last activity</th><th>Flags</th><th>Repairs</th></tr></thead><tbody>';
    turns.forEach(function (c) {
      th += '<tr><td><div class="pl-addr">' + esc(c.address) + '</div><div class="pl-small">' + esc(c.owners.join(', ')) + '</div></td><td>' + esc(c.stage) + '</td><td>' + plDays(c.daysInStage, 14, 30) + '</td><td>' + plWhen(c) + '</td><td>' + esc(c.turnItems || '—') + '</td><td>' + plChecklist(c) + '</td><td>' + plLast(c) + '</td><td>' + (plFlags(c) || '<span class="pl-small">—</span>') + '</td><td>' + rpButton(c) + '</td></tr>';
    });
    th += '</tbody></table></div>';
  }
  T.innerHTML = th + '</div>';
}
// ---- Repair items (saved in hub storage; never written to Aptly or Rentvine) ----
var RP = { sums: {}, cur: null, opener: null };
var RP_PAYER = [['tbd', 'Not decided'], ['tenant', 'Tenant'], ['owner', 'Owner'], ['aloe', 'Aloe']];
var RP_SRC = [['none', 'No estimate yet'], ['vendor', 'Vendor quote'], ['price-list', 'Price list'], ['ai', 'AI estimate']];
var RP_STAT = [['needed', 'Needed'], ['asked', 'Estimate asked'], ['received', 'Estimate received'], ['shared-tenant', 'Shared with tenant'], ['shared-owner', 'Shared with owner'], ['done', 'Done']];
function money(n) { return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function rpKey(c) { return c.aptlyId || c.id; }
function rpButton(c) {
  var s = RP.sums[rpKey(c)];
  var label = s && s.count ? s.count + (s.count === 1 ? ' item' : ' items') + ' · ' + money(s.totals.all) : 'Add repairs';
  return '<button class="rp-btn" type="button" data-rp="' + esc(rpKey(c)) + '" data-addr="' + esc(c.address) + '">' + esc(label) + '</button>';
}
async function rpLoadSummaries() {
  try {
    var r = await fetch('/api/moveouts/repairs', { credentials: 'same-origin' });
    if (r.ok) { var j = await r.json(); RP.sums = j.summaries || {}; }
  } catch (e) {}
}
function rpSel(opts, val) { return opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
function rpRow(it, i) {
  return '<tr data-i="' + i + '">'
    + '<td><input aria-label="Repair item" data-f="description" value="' + esc(it.description) + '" maxlength="300"></td>'
    + '<td><input aria-label="Area" data-f="area" value="' + esc(it.area) + '" maxlength="60"></td>'
    + '<td><select aria-label="Who pays" data-f="payer">' + rpSel(RP_PAYER, it.payer) + '</select></td>'
    + '<td><select aria-label="Estimate source" data-f="source">' + rpSel(RP_SRC, it.source) + '</select></td>'
    + '<td><input aria-label="Vendor" data-f="vendor" value="' + esc(it.vendor) + '" maxlength="80"></td>'
    + '<td><input aria-label="Amount" data-f="amount" inputmode="decimal" value="' + (it.amount == null ? '' : esc(it.amount)) + '" style="min-width:80px"></td>'
    + '<td><select aria-label="Status" data-f="status">' + rpSel(RP_STAT, it.status) + '</select></td>'
    + '<td><button type="button" class="btn btn-line" data-del="' + i + '" aria-label="Remove item ' + (i + 1) + '" style="padding:0 12px">Remove</button></td></tr>';
}
function rpCollect() {
  var rows = document.querySelectorAll('#rp-body tr'), items = [];
  rows.forEach(function (tr) {
    var o = {};
    tr.querySelectorAll('[data-f]').forEach(function (el) { o[el.getAttribute('data-f')] = el.value; });
    items.push(o);
  });
  return items;
}
function rpTotalsHtml(items) {
  var t = { tenant: 0, owner: 0, aloe: 0, tbd: 0, none: 0 };
  items.forEach(function (it) { var a = parseFloat(it.amount); if (isNaN(a)) t.none++; else t[it.payer] = (t[it.payer] || 0) + a; });
  return '<div>Tenant<b>' + money(t.tenant) + '</b></div><div>Owner<b>' + money(t.owner) + '</b></div><div>Aloe<b>' + money(t.aloe) + '</b></div><div>Not decided<b>' + money(t.tbd) + '</b></div><div>Items with no amount<b>' + t.none + '</b></div>';
}
function rpMsg(kind, text) { var m = document.getElementById('rp-msg'); if (m) { m.className = 'rp-msg ' + kind; m.textContent = text; m.style.display = text ? 'block' : 'none'; } }
function rpClose() {
  var b = document.getElementById('rp-back'); if (b) b.remove();
  document.removeEventListener('keydown', rpKey_);
  var o = RP.opener; RP.cur = null;
  if (o && !document.contains(o)) { var again = document.querySelectorAll('[data-rp]'); o = null; var k = RP.openerKey; for (var i = 0; i < again.length; i++) if (again[i].getAttribute('data-rp') === k && again[i].offsetParent !== null) { o = again[i]; break; } }
  if (o) o.focus();
}
function rpKey_(e) { if (e.key === 'Escape') rpClose(); }
function rpRefreshTotals() { var el = document.getElementById('rp-tot'); if (el) el.innerHTML = rpTotalsHtml(rpCollect()); }
async function rpOpen(id, addr, opener) {
  RP.opener = opener; RP.openerKey = id;
  var back = document.createElement('div'); back.className = 'rp-back'; back.id = 'rp-back';
  back.innerHTML = '<div class="rp-dlg" role="dialog" aria-modal="true" aria-labelledby="rp-title"><h2 id="rp-title">Repair items</h2><div class="pl-small">' + esc(addr) + '</div><div id="rp-msg" class="rp-msg" style="display:none" role="status"></div><div id="rp-content" class="pl-note">Loading…</div></div>';
  document.body.appendChild(back);
  back.addEventListener('mousedown', function (e) { if (e.target === back) rpClose(); });
  document.addEventListener('keydown', rpKey_);
  try {
    var r = await fetch('/api/moveouts/repairs/' + encodeURIComponent(id), { credentials: 'same-origin' });
    var j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.error) throw new Error((j && j.error) || 'The server answered ' + r.status);
    RP.cur = { id: id, addr: addr, rev: j.rev || 0, items: j.items || [], updatedAt: j.updatedAt, updatedBy: j.updatedBy };
    rpDraw();
  } catch (e) {
    document.getElementById('rp-content').innerHTML = '';
    rpMsg('err', 'Could not load repair items (' + e.message + '). Close this and try again.');
    return;
  }
}
function rpDraw() {
  var c = RP.cur, ed = ''; try { ed = localStorage.getItem('aloe_moveout_editor') || ''; } catch (e) {}
  var h = '<p class="pl-note">Saved in the hub only. Nothing here is sent to the tenant or owner, and nothing changes in Aptly or Rentvine. “Not decided” = who pays is still open.</p>'
    + '<div class="rp-grid"><table class="rp-tbl"><thead><tr><th>Repair item</th><th>Area</th><th>Who pays</th><th>Estimate source</th><th>Vendor</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="rp-body">'
    + c.items.map(rpRow).join('') + '</tbody></table></div>'
    + '<button type="button" class="btn btn-line" id="rp-add">Add item</button>'
    + '<div class="rp-tot" id="rp-tot">' + rpTotalsHtml(c.items) + '</div>'
    + '<div class="pl-small">' + (c.updatedAt ? 'Last saved ' + esc(new Date(c.updatedAt).toLocaleString('en-US', { timeZone: 'America/Phoenix', dateStyle: 'medium', timeStyle: 'short' })) + ' by ' + esc(c.updatedBy) : 'Not saved yet') + '</div>'
    + '<div class="rp-ed"><div class="f"><label for="rp-by">Edited by (your name)</label><input id="rp-by" maxlength="40" value="' + esc(ed) + '"></div>'
    + '<button type="button" class="btn btn-line" id="rp-save" style="background:#0A5468;color:#fff;border-color:#0A5468">Save</button><button type="button" class="btn btn-line" id="rp-close">Close</button></div>';
  document.getElementById('rp-content').className = ''; document.getElementById('rp-content').innerHTML = h;
  var body = document.getElementById('rp-body');
  body.addEventListener('input', rpRefreshTotals); body.addEventListener('change', rpRefreshTotals);
  body.addEventListener('click', function (e) { var d = e.target.getAttribute && e.target.getAttribute('data-del'); if (d != null) { RP.cur.items = rpCollect(); RP.cur.items.splice(+d, 1); rpDraw(); } });
  document.getElementById('rp-add').addEventListener('click', function () {
    RP.cur.items = rpCollect(); RP.cur.items.push({ description: '', area: '', payer: 'tbd', source: 'none', vendor: '', amount: null, status: 'needed' }); rpDraw();
    var rows = document.querySelectorAll('#rp-body tr'); var f = rows[rows.length - 1].querySelector('input'); if (f) f.focus();
  });
  document.getElementById('rp-close').addEventListener('click', rpClose);
  document.getElementById('rp-save').addEventListener('click', rpSave);
  (c.items.length ? document.getElementById('rp-add') : document.getElementById('rp-add')).focus();
}
async function rpSave() {
  var c = RP.cur, by = document.getElementById('rp-by').value.trim(), btn = document.getElementById('rp-save');
  rpMsg('', '');
  var items = rpCollect();
  if (items.some(function (it) { return !String(it.description).trim(); })) return rpMsg('err', 'Every item needs a description. Fill it in or remove the row.');
  if (items.some(function (it) { return it.amount !== '' && (isNaN(parseFloat(it.amount)) || parseFloat(it.amount) < 0); })) return rpMsg('err', 'An amount is not a valid number.');
  if (!by) return rpMsg('err', 'Enter your name in “Edited by” before saving.');
  try { localStorage.setItem('aloe_moveout_editor', by); } catch (e) {}
  btn.disabled = true;
  try {
    var r = await fetch('/api/moveouts/repairs/' + encodeURIComponent(c.id), { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items, baseRev: c.rev, editor: by }) });
    var j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.error) { rpMsg('err', (j && j.error) || ('Save failed (' + r.status + '). Nothing was saved.')); btn.disabled = false; return; }
    RP.cur = { id: c.id, addr: c.addr, rev: j.rev, items: j.items, updatedAt: j.updatedAt, updatedBy: j.updatedBy };
    RP.sums[c.id] = { count: j.items.length, totals: { all: j.items.reduce(function (s, it) { return s + (it.amount || 0); }, 0) } };
    rpDraw(); rpMsg('ok', 'Saved.'); plRender();
  } catch (e) { rpMsg('err', 'Could not reach the hub. Nothing was saved.'); btn.disabled = false; }
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-rp]');
  if (b) rpOpen(b.getAttribute('data-rp'), b.getAttribute('data-addr'), b);
});
async function loadPipeline(force) {
  if (plState === 'loading' || (plState === 'done' && !force)) return;
  plState = 'loading'; plRender();
  try {
    var r = await fetch('/api/moveouts/pipeline' + (force ? '?refresh=1' : ''), { credentials: 'same-origin' });
    var j = await r.json().catch(function () { return null; });
    if (!r.ok || !j || j.error) { PL = { error: (j && j.error) || ('The server answered ' + r.status) }; plState = 'error'; }
    else { PL = j; plState = 'done'; await rpLoadSummaries(); }
  } catch (e) { PL = { error: 'Could not reach the hub (' + e.message + ').' }; plState = 'error'; }
  plRender();
}

async function loadData(live) {
  var rb = document.getElementById('refresh-btn'), fb = document.getElementById('force-btn');
  var errEl = document.getElementById('error');
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('panes').style.display = 'none';
  errEl.style.display = 'none';
  rb.disabled = true; fb.disabled = true;
  try {
    if (live) { try { await fetch('/api/metrics/refresh', { credentials: 'same-origin' }); } catch (e) {} }
    var r = await fetch('/api/metrics', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('The server answered ' + r.status);
    D = await r.json();
    if (D && D.error) throw new Error(D.error);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('panes').style.display = 'block';
    var gen = D.generatedAt ? new Date(D.generatedAt) : new Date();
    var age = Math.round((Date.now() - gen.getTime()) / 60000);
    document.getElementById('live-time').textContent = 'Data from ' + (age < 1 ? 'just now' : age === 1 ? '1 min ago' : age + ' min ago');
    renderMoveOuts();
    switchTab(activeTab);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    errEl.textContent = 'Could not load move-outs (' + e.message + '). Press Refresh to try again.';
    errEl.style.display = 'block';
  } finally {
    rb.disabled = false; fb.disabled = false;
  }
}
document.getElementById('refresh-btn').addEventListener('click', function () { loadData(false); if (plState !== 'idle') { plState = 'idle'; if (activeTab === 'pipeline' || activeTab === 'turns') loadPipeline(false); } });
document.getElementById('force-btn').addEventListener('click', function () { loadData(true); if (plState !== 'idle') { plState = 'idle'; if (activeTab === 'pipeline' || activeTab === 'turns') loadPipeline(true); } });
if (['recon', 'pipeline', 'turns'].indexOf(location.hash.slice(1)) >= 0) activeTab = location.hash.slice(1);
loadData(false);
</script>
