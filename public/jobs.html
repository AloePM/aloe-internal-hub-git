<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scheduled Jobs - Aloe PM</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 40px; background: #fafafa; color: #1a1a1a; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .subtitle { color: #666; margin: 0 0 24px; }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; max-width: 700px; }
  .summary-card { background: white; border-radius: 10px; padding: 16px; border: 1px solid #eee; }
  .summary-card .label { font-size: 13px; color: #888; margin-bottom: 4px; }
  .summary-card .value { font-size: 24px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
  th { text-align: left; padding: 10px 14px; font-size: 13px; color: #888; border-bottom: 1px solid #eee; }
  td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #f2f2f2; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .badge-ok { background: #e6f7ed; color: #1a7f45; }
  .badge-warn { background: #fff4e5; color: #b26a00; }
  .badge-error { background: #fde8e8; color: #c0362c; }
  .badge-neutral { background: #f0f0f0; color: #666; }
  .badge-never { background: #e8eefc; color: #2b5fc7; }
  .job-name { font-weight: 600; }
  .job-what { color: #777; font-size: 13px; margin-top: 2px; }
  .mono { font-family: ui-monospace, monospace; font-size: 13px; color: #555; }
  .loading { padding: 40px; text-align: center; color: #888; }
  .filter-btn { background: white; border: 1px solid #ddd; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-right: 6px; }
  .filter-btn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .agent-tag { display: inline-block; background: #f0e8fc; color: #6b3fa0; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
</style>
</head>
<body>
  <h1>Scheduled Jobs</h1>
  <p class="subtitle">Everything that's supposed to run automatically, and whether it actually did.</p>
  <div style="margin-bottom:16px;">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" data-filter="ai_agent" onclick="setFilter('ai_agent')">AI Agents</button>
    <button class="filter-btn" data-filter="server_job" onclick="setFilter('server_job')">Server Jobs</button>
  </div>
  <div id="content" class="loading">Loading...</div>

<script>
function badgeFor(job) {
  if (job.mechanism !== 'Cloud Scheduler') {
    if ((job.status || '').startsWith('paused')) return { cls: 'badge-neutral', text: 'Not on Scheduler' };
    if ((job.status || '').includes('needs investigation')) return { cls: 'badge-warn', text: 'Needs Investigation' };
    return { cls: 'badge-neutral', text: job.mechanism };
  }
  const live = job.live || {};
  if (live.liveStatusError) return { cls: 'badge-error', text: 'Status check failed' };
  if (live.liveState === 'PAUSED') return { cls: 'badge-neutral', text: 'Paused' };
  if (live.lastAttemptStatus === 'Never run yet') return { cls: 'badge-never', text: 'Never run yet' };
  if (live.lastAttemptStatus === 'OK') return { cls: 'badge-ok', text: 'OK' };
  if ((live.lastAttemptStatus || '').startsWith('ERROR')) return { cls: 'badge-error', text: live.lastAttemptStatus };
  return { cls: 'badge-neutral', text: 'Unknown' };
}

function fmtTime(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Phoenix' }) + ' AZ';
}

let allJobs = [];
let currentFilter = 'all';

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  render();
}

async function load() {
  const res = await fetch('/api/jobs');
  const data = await res.json();
  allJobs = data.jobs;
  render();
}

function render() {
  const jobs = currentFilter === 'all' ? allJobs : allJobs.filter(j => j.type === currentFilter);

  let ok = 0, warn = 0, error = 0, other = 0;
  jobs.forEach(j => {
    const b = badgeFor(j);
    if (b.cls === 'badge-ok') ok++;
    else if (b.cls === 'badge-error') error++;
    else if (b.cls === 'badge-warn') warn++;
    else other++;
  });

  const summaryHtml = `
    <div class="summary">
      <div class="summary-card"><div class="label">OK</div><div class="value" style="color:#1a7f45">${ok}</div></div>
      <div class="summary-card"><div class="label">Errors</div><div class="value" style="color:#c0362c">${error}</div></div>
      <div class="summary-card"><div class="label">Needs Attention</div><div class="value" style="color:#b26a00">${warn}</div></div>
      <div class="summary-card"><div class="label">Total Jobs</div><div class="value">${jobs.length}</div></div>
    </div>`;

  const rows = jobs.map(j => {
    const b = badgeFor(j);
    const live = j.live || {};
    return `
      <tr>
        <td>
          <div class="job-name">${j.name}${j.agent ? `<span class="agent-tag">${j.agent}</span>` : ''}</div>
          <div class="job-what">${j.what || ''}</div>
        </td>
        <td class="mono">${j.schedule || live.liveSchedule || '\u2014'}</td>
        <td style="font-size:12px;">${j.livesAt || j.mechanism}</td>
        <td><span class="badge ${b.cls}">${b.text}</span></td>
        <td>${fmtTime(live.lastAttemptTime)}</td>
        <td>${j.notifies || '\u2014'}</td>
      </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    ${summaryHtml}
    <table>
      <tr>
        <th>Job</th>
        <th>Schedule</th>
        <th>Lives At</th>
        <th>Status</th>
        <th>Last Ran</th>
        <th>Notifies</th>
      </tr>
      ${rows}
    </table>
    <p style="margin-top:16px;color:#999;font-size:13px;">Last checked: ${new Date().toLocaleString('en-US', { timeZone: 'America/Phoenix' })} AZ &nbsp;&middot;&nbsp; <a href="#" onclick="location.reload();return false;">Refresh</a></p>
  `;
}

load();
</script>
</body>
</html>
