<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>SOPs — Aloe PM</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1a2332;min-height:100vh;display:flex}.sidebar{width:220px;min-height:100vh;background:#F8FAFA;border-right:1px solid #E8EEEE;display:flex;flex-direction:column;padding:20px 0;flex-shrink:0}.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid #E8EEEE;margin-bottom:16px}.logo-text{font-size:15px;font-weight:800}.logo-sub{font-size:11px;color:#8AA0A0}.nav-link{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:#4A6060;text-decoration:none}.nav-link:hover,.nav-link.active{background:#E8F8FC;color:#2A8FA6}.nav-icon{font-size:14px;width:18px}.sidebar-footer{margin-top:auto;padding:16px 20px;font-size:11px;color:#8AA0A0;border-top:1px solid #E8EEEE}.main{flex:1;display:flex;flex-direction:column}.topbar{padding:16px 28px;border-bottom:1px solid #E8EEEE}.topbar-title{font-size:18px;font-weight:700}.topbar-sub{font-size:12px;color:#8AA0A0}.content{padding:24px 28px;flex:1}.sop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.sop-card{background:#F8FAFA;border:1px solid #E8EEEE;border-radius:10px;padding:16px 18px}.sop-title{font-size:14px;font-weight:700;margin-bottom:6px}.sop-desc{font-size:12px;color:#8AA0A0}.sop-tag{display:inline-block;font-size:10px;font-weight:700;background:#E8F8FC;color:#2A8FA6;padding:2px 8px;border-radius:10px;margin-top:8px}.lbl{font-size:11px;font-weight:700;color:#8AA0A0;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}</style></head>
<body><div class="sidebar"><div class="sidebar-logo"><div class="logo-text">🌿 Aloe PM</div><div class="logo-sub">Agent Hub</div></div><a href="/agents" class="nav-link"><span class="nav-icon">⬛</span>Overview</a><a href="/agents/activity" class="nav-link"><span class="nav-icon">📋</span>Activity</a><a href="/agents/playbooks" class="nav-link"><span class="nav-icon">📝</span>Playbooks</a><a href="/agents/knowledge" class="nav-link"><span class="nav-icon">💡</span>Knowledge</a><a href="/agents/sops" class="nav-link active"><span class="nav-icon">⚙️</span>SOPs</a><a href="/agents/jobs" class="nav-link"><span class="nav-icon">🕐</span>Jobs</a><a href="/agents/training" class="nav-link"><span class="nav-icon">🎯</span>Training</a><div class="sidebar-footer">hub.aloepm.com</div></div>
<div class="main"><div class="topbar"><div class="topbar-title">SOP Library</div><div class="topbar-sub">Standard Operating Procedures available to all agents</div></div>
<div class="content"><div class="lbl">All SOPs</div><div class="sop-grid" id="grid"><div style="color:#8AA0A0;font-size:13px">Loading...</div></div></div></div>
<script>async function load(){try{const r=await fetch('/api/agents/sops');const d=await r.json();const sops=d.sops||d||[];if(!sops.length){document.getElementById('grid').innerHTML='<div style="color:#8AA0A0;font-size:13px">No SOPs found.</div>';return;}document.getElementById('grid').innerHTML=sops.map(s=>'<div class="sop-card"><div class="sop-title">'+(s.title||s.id||'SOP')+'</div><div class="sop-desc">'+(s.description||s.summary||'')+'</div>'+(s.agent?'<div class="sop-tag">'+s.agent+'</div>':'')+'</div>').join('');}catch(e){document.getElementById('grid').innerHTML='<div style="color:#EF4444;font-size:13px">Error loading SOPs.</div>';}}load();</script><script src="/hub-shell.js" defer></script>
</body></html>
