    "rio verde": { avg_rent: 2800, trend: "-5% YoY", vacancy_rate: "10%+", comp_range: "$2,200-$4,000", avg_dom: 45, note: "Seasonal/retirement area. Higher vacancy.", by_bed: { "3bd": 2800, "4bd": 3400, "5bd": 4200 } },
  }
};

function getCityData(city) {
  if (!city) return MARKET_DATA.cities.maricopa;
  const key = city.toLowerCase().trim();
  return MARKET_DATA.cities[key] || MARKET_DATA.cities.maricopa;
}

function scoreProperty({ rent, beds, city, leads, showings, dom }) {
  let score = 0; const factors = []; const suggestions = [];
  const cityData = getCityData(city);
  const bedKey = `${beds}bd`;
  const compRent = cityData.by_bed?.[bedKey] || cityData.avg_rent || 1700;
  if (leads === 0) { score += 30; factors.push("Zero leads — no market interest"); suggestions.push("Verify syndication active on Zillow, Apartments.com, Homes.com"); suggestions.push("Add more listing photos (aim for 25+) and a virtual tour"); }
  else if (leads === 1) { score += 20; factors.push("Only 1 lead — very low interest"); suggestions.push("Review listing title and description for keyword optimization"); }
  else if (leads < 4) { score += 10; factors.push(`${leads} leads — moderate interest`); }
  else { factors.push(`${leads} leads — good pipeline`); }
  if (leads > 0 && showings === 0) { score += 20; factors.push("Leads but NO showings — conversion problem"); suggestions.push("Follow up with leads within 24 hours to schedule showings"); }
  else if (showings === 0 && leads === 0) { score += 15; factors.push("No showings (no leads to convert)"); }
  else if (showings >= 2) { factors.push(`${showings} showings — good activity`); score -= 5; }
  if (dom > 60) { score += 25; factors.push(`${dom} days on market — significantly stale`); suggestions.push(`URGENT: Consider price reduction. Market avg is $${compRent}/mo`); suggestions.push("Refresh listing description and photos"); }
  else if (dom > 30) { score += 15; factors.push(`${dom} days on market — getting stale`); suggestions.push("Consider offering a move-in concession (e.g., 50% off first month)"); }
  else if (dom > 14) { score += 8; factors.push(`${dom} days on market — within normal range`); }
  else { factors.push(`${dom} days on market — fresh listing`); }
  if (compRent > 0 && rent > 0) {
    const pct = ((rent - compRent) / compRent) * 100;
    if (pct > 10) { score += 25; factors.push(`Priced $${Math.round(rent-compRent)}/mo above market avg`); suggestions.push(`Market comp for ${beds}bd in ${city}: $${compRent}/mo. Suggest reducing to $${Math.round(compRent*1.02)}`); }
    else if (pct > 5) { score += 12; factors.push(`Priced $${Math.round(rent-compRent)}/mo above market avg`); suggestions.push("Slightly above market. Consider matching at market rate"); }
    else if (pct < -10) { score -= 5; factors.push(`Priced BELOW market by $${Math.round(compRent-rent)}/mo`); }
    else { factors.push(`Rent aligned with market avg ($${compRent}/mo)`); }
  }
  const vacancy = cityData.vacancy_rate || "";
  if (vacancy) suggestions.push(`Market context: ${city} vacancy rate is ${vacancy}. ${cityData.note || ""}`);
  score = Math.max(0, Math.min(100, score));
  const level = score >= 50 ? "HIGH" : score >= 25 ? "MEDIUM" : "LOW";
  return { score, level, factors, suggestions, compRent, cityData };
}

function getPetLabel(unit) {
  const restrictions = Array.isArray(unit.petRestrictions) ? unit.petRestrictions : [];
  const petsAllowed = unit.petsAllowed;
  const noDogs = restrictions.some(r => /no dog/i.test(r));
  const noCats = restrictions.some(r => /no cat/i.test(r));
  const dogsOk = restrictions.some(r => /dog.*allow/i.test(r));
  const catsOk = restrictions.some(r => /cat.*allow/i.test(r));
  if (petsAllowed === false || (noDogs && noCats)) return { label: 'No Pets', cls: 'pet-no' };
  if (noDogs && !noCats) return { label: 'Cats Only', cls: 'pet-partial' };
  if (noCats && !noDogs) return { label: 'Dogs Only', cls: 'pet-partial' };
  if (petsAllowed === true || dogsOk || catsOk) return { label: 'Pets OK', cls: 'pet-ok' };
  return { label: 'Pets OK*', cls: 'pet-ok' };
}

// Build weekly activity buckets from a list of leads, starting from listDate
function buildWeeklyActivity(leads, listDate) {
  if (!listDate || !leads || leads.length === 0) return [];
  const start = new Date(listDate);
  start.setHours(0,0,0,0);
  const now = new Date();
  const totalWeeks = Math.ceil((now - start) / (7 * 86400000)) || 1;
  const weeks = [];
  for (let w = 0; w < totalWeeks; w++) {
    const wStart = new Date(start.getTime() + w * 7 * 86400000);
    const wEnd = new Date(wStart.getTime() + 7 * 86400000);
    const weekLeads = leads.filter(l => {
      const d = new Date(l.createdAt || l.date || '');
      return d >= wStart && d < wEnd;
    });
    const showings = weekLeads.filter(l => /scheduled tour|tour completed/i.test(l.stage || ''));
    const completed = weekLeads.filter(l => /tour completed/i.test(l.stage || ''));
    weeks.push({
      week: w + 1,
      label: `Wk ${w+1} (${wStart.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})})`,
      leads: weekLeads.length,
      showings: showings.length,
      completed: completed.length,
    });
  }
  return weeks;
}

function buildWeeklySourceActivity(leads, cutoffDate) {
  if (!cutoffDate || !leads || leads.length === 0) return { weeks: [], sourceTotals: {} };
  const knownSources = ['Zillow', 'Realtor.com', 'Homes.com', 'Apartments.com', 'RentMarketplace', 'Zumper'];
  const normalizeSource = (s) => {
    const found = knownSources.find(k => (s || '').toLowerCase().includes(k.toLowerCase()));
    return found || 'Other';
  };
  const start = new Date(cutoffDate);
  start.setHours(0,0,0,0);
  const now = new Date();
  const totalWeeks = Math.ceil((now - start) / (7 * 86400000)) || 1;
  const weeks = [];
  const sourceTotals = {};
  for (let w = 0; w < totalWeeks; w++) {
    const wStart = new Date(start.getTime() + w * 7 * 86400000);
    const wEnd = new Date(wStart.getTime() + 7 * 86400000);
    const weekLeads = leads.filter(l => {
      const d = new Date(l.createdAt || l.date || '');
      return d >= wStart && d < wEnd;
    });
    weeks.push({
      week: w + 1,
      label: `Wk ${w+1} (${wStart.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})})`,
      total: weekLeads.length,
    });
    weekLeads.forEach(l => {
      const src = normalizeSource(l.source);
      sourceTotals[src] = (sourceTotals[src] || 0) + 1;
    });
  }
  return { weeks, sourceTotals };
}
const STAGE_COLORS = {
  'Tour Completed': 'stage-completed',
  'Scheduled Tour': 'stage-scheduled',
  'Tour Canceled / No Show': 'stage-canceled',

};

function WeeklyLeadsChart({ weeklySourceActivity, weeklyChartId, donutChartId }) {
  const lineRef = React.useRef(null);
  const donutRef = React.useRef(null);
  const lineChartInstance = React.useRef(null);
  const donutChartInstance = React.useRef(null);
  React.useEffect(() => {
    if (!weeklySourceActivity || !weeklySourceActivity.weeks || weeklySourceActivity.weeks.length === 0) return;
    const weeks = weeklySourceActivity.weeks;
    const sourceTotals = weeklySourceActivity.sourceTotals || {};
    const sourceColors = { 'Zillow': '#2a78d6', 'Realtor.com': '#eb6834', 'Homes.com': '#1baf7a', 'Apartments.com': '#eda100', 'RentMarketplace': '#e87ba4', 'Zumper': '#6250d6', 'Other': '#e34948' };
    if (lineChartInstance.current) lineChartInstance.current.destroy();
    if (donutChartInstance.current) donutChartInstance.current.destroy();
    if (lineRef.current) {
      lineChartInstance.current = new Chart(lineRef.current, {
        type: 'line',
        data: {
          labels: weeks.map(w => w.label),
          datasets: [{ data: weeks.map(w => w.total), borderColor: '#2a78d6', backgroundColor: '#2a78d6', tension: 0.3, pointRadius: 3, pointBackgroundColor: '#2a78d6' }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } }, y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10 } }, grid: { color: '#e1e0d9' } } } }
      });
    }
    const sourceLabels = Object.keys(sourceTotals);
    if (donutRef.current && sourceLabels.length > 0) {
      donutChartInstance.current = new Chart(donutRef.current, {
        type: 'doughnut',
        data: { labels: sourceLabels, datasets: [{ data: sourceLabels.map(s => sourceTotals[s]), backgroundColor: sourceLabels.map(s => sourceColors[s] || '#888780') }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '65%' }
      });
    }
    return () => {
      if (lineChartInstance.current) lineChartInstance.current.destroy();
      if (donutChartInstance.current) donutChartInstance.current.destroy();
    };
  }, [weeklySourceActivity]);
  if (!weeklySourceActivity || !weeklySourceActivity.weeks || weeklySourceActivity.weeks.length === 0) {
    return <div style={{fontSize:12,color:'var(--text3)'}}>No lead activity yet</div>;
  }
  const sourceTotals = weeklySourceActivity.sourceTotals || {};
  const sourceColors = { 'Zillow': '#2a78d6', 'Realtor.com': '#eb6834', 'Homes.com': '#1baf7a', 'Apartments.com': '#eda100', 'RentMarketplace': '#e87ba4', 'Zumper': '#6250d6', 'Other': '#e34948' };
  return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:12,alignItems:'center'}}>
        <div>
          <div style={{fontSize:10,color:'var(--text3)',marginBottom:4}}>Leads / week</div>
          <div style={{position:'relative',width:'100%',height:100}}>
            <canvas ref={lineRef} role="img" aria-label="Weekly lead volume trend"></canvas>
          </div>
        </div>
        <div>
          <div style={{fontSize:10,color:'var(--text3)',marginBottom:4}}>Source mix</div>
          <div style={{position:'relative',width:'100%',height:100}}>
            <canvas ref={donutRef} role="img" aria-label="Lead source breakdown"></canvas>
          </div>
        </div>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:6}}>
        {Object.keys(sourceTotals).map(s => (
          <span key={s} style={{fontSize:10,color:'var(--text3)',display:'flex',alignItems:'center',gap:3}}>
            <span style={{width:8,height:8,borderRadius:2,background:sourceColors[s]||'#888780'}}></span>{s} {sourceTotals[s]}
          </span>
        ))}
      </div>
    </div>
  );
}
function App() {
  const [tab, setTab] = useState("overview");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [data, setData] = useState(null);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [filter, setFilter] = useState("ALL");
  const [search, setSearch] = useState("");
  const [syncData, setSyncData] = useState(null);
  const [syncLoading, setSyncLoading] = useState(false);
  const [commercialData, setCommercialData] = useState(null);
  const [commercialLoading, setCommercialLoading] = useState(false);
  const [commercialCity, setCommercialCity] = useState('Chandler');
  const [commercialType, setCommercialType] = useState('all');
  const [commercialTxn, setCommercialTxn] = useState('lease');
  const [expanded, setExpanded] = useState(null);

  async function fetchAll() {
    setLoading(true); setError(null);
    try {
      // Fetch published units
      const unitsRes = await fetch('/api/aptly/units').then(r => r.json());
      const publishedUnits = (unitsRes.units || []).filter(u =>
        u.publishedForRent === true || u.syndicate === true ||
        u['Published For Rent'] === 'checked' || u['Syndicate'] === 'checked'
      );

      // Fetch leads from leads-rich route (schema-mapped from core API)
      let richLeads = [];
      try {
        const leadsRes = await fetch('/api/aptly/leads-rich').then(r => r.json());
        if (leadsRes && Array.isArray(leadsRes.leads)) {
          richLeads = leadsRes.leads;
        }
      } catch(e) { richLeads = []; }

      // Fetch applications from applications-rich route (schema-mapped from core API)
      let richApplications = [];
      try {
        const appsRes = await fetch('/api/aptly/applications-rich').then(r => r.json());
        if (appsRes && Array.isArray(appsRes.applications)) {
          richApplications = appsRes.applications;
        }
      } catch(e) { richApplications = []; }

      const processed = processData(publishedUnits, richLeads, richApplications);
      setData({ ...processed, totalInPortfolio: unitsRes.total || 0 });
      setLastRefresh(new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }));
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }

  function processData(units, allLeads, allApplications) {
    try {
    const safeApplications = Array.isArray(allApplications) ? allApplications : [];
    const bucketAppStatus = (status) => {
      const s = (status || '').toLowerCase();
      if (/incomplete/.test(s) && /all/.test(s)) return 'started';
      if (/partially/.test(s)) return 'inProgress';
      if (/pending screening/.test(s)) return 'screeningReady';
      if (/screening incomplete/.test(s)) return 'screeningInProgress';
      if (/pending decision/.test(s)) return 'awaitingDecision';
      if (/approved/.test(s)) return 'approved';
      if (/denied/.test(s)) return 'denied';
      if (/closed|cancel/.test(s)) return 'cancelled';
      return 'other';
    };
    const safeLeads = Array.isArray(allLeads) ? allLeads : [];
    const normalize = s => { try { return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'').substring(0,12); } catch(e) { return ''; } };

    const processed = (Array.isArray(units) ? units : []).map((u, uidx) => {
      try {
      const address = u.street || (u.address && typeof u.address === 'object' ? u.address.address : '') || u.marketingName || '';
      const city = u.city || (u.address && typeof u.address === 'object' ? u.address.city : '') || '';
      const rent = u.marketRent ? (typeof u.marketRent === 'object' ? parseFloat(u.marketRent.amount || 0) : parseFloat(u.marketRent || 0)) : 0;
      const beds = parseInt(u.beds || 3) || 3;
      const baths = u.baths || '';
      const sqft = u.totalArea || 0;

      // "Date listed" = 60 days before the current vacancy began (matches Aloe PM's
      // pre-marketing practice), derived from the unit's stageHistory. Falls back to
      // availableDate if no stageHistory Vacant entry exists. Never negative.
      let dom = 0, listDate = null;
      try {
        const history = Array.isArray(u.stageHistory) ? u.stageHistory : [];
        const vacantEntries = history.filter(h => h && h.stage === 'Vacant' && h.stageUpdatedAt);
        let cutoff = null;
        if (vacantEntries.length > 0) {
          const mostRecentVacant = vacantEntries.reduce((a, b) => new Date(a.stageUpdatedAt) > new Date(b.stageUpdatedAt) ? a : b);
          cutoff = new Date(new Date(mostRecentVacant.stageUpdatedAt).getTime() - 60 * 86400000);
        } else if (u.availableDate) {
          cutoff = new Date(u.availableDate);
        }
        if (cutoff) {
          const now = new Date();
          dom = Math.max(0, Math.floor((now - cutoff) / 86400000));
          listDate = cutoff.toISOString();
        }
      } catch(e) {}

      // Match leads to this property by street number + word
      const streetNum = (address.match(/^\d+/) || [])[0] || '';
      const propLeads = streetNum ? safeLeads.filter(l => {
        try {
          const pref = (l.address || l.preferredRental || '');
          return pref && pref.includes(streetNum);
        } catch(e) { return false; }
      }) : [];

      const totalLeads = propLeads.length;
      const scheduledTours = propLeads.filter(l => /scheduled tour/i.test(l.stage||'')).length;
      const completedTours = propLeads.filter(l => /tour completed/i.test(l.stage||'')).length;
      const canceledTours = propLeads.filter(l => /canceled|no show/i.test(l.stage||'')).length;
      const applied = propLeads.filter(l => /applied/i.test(l.stage||'')).length;
      // Match applications to this property by street number (same pattern as leads)
      // Homes are typically listed for marketing ~60 days before the current vacancy date.
      // Use the most recent "Vacant" transition from stageHistory minus 60 days as the cutoff,
      // so applications from the pre-marketing window count but prior leasing cycles don't.
      // Falls back to availableDate if stageHistory has no Vacant entry.
      // listDate is already the vacancy-cycle cutoff (computed above from stageHistory)
      const appCutoffDate = listDate ? new Date(listDate) : null;
      const weeklySourceActivity = buildWeeklySourceActivity(propLeads, appCutoffDate);
      const propApplications = streetNum ? safeApplications.filter(a => {
        try {
          const loc = (a['Application Location'] || '');
          if (!loc || !loc.includes(streetNum)) return false;
          if (!appCutoffDate) return true;
          const createdAt = a['Created At'] ? new Date(a['Created At']) : null;
          if (!createdAt || isNaN(createdAt)) return true;
          return createdAt >= appCutoffDate;
        } catch(e) { return false; }
      }) : [];
      const appFunnel = { started: 0, inProgress: 0, screeningReady: 0, screeningInProgress: 0, awaitingDecision: 0, approved: 0, denied: 0, cancelled: 0, other: 0 };
      propApplications.forEach(a => {
        const bucket = bucketAppStatus(a['Status']);
        appFunnel[bucket] = (appFunnel[bucket] || 0) + 1;
      });
      const appFunnelActive = appFunnel.started + appFunnel.inProgress + appFunnel.screeningReady + appFunnel.screeningInProgress + appFunnel.awaitingDecision;

      // Weekly activity — wrapped safely
      let weeklyActivity = [];
      try { weeklyActivity = buildWeeklyActivity(propLeads, listDate); } catch(e) {}

      // Tour leads — wrapped safely
      let tourLeads = [];
      try {
        tourLeads = propLeads.filter(l =>
          /scheduled tour|tour completed|tour canceled/i.test(l.stage||'') || (l.comments && l.comments.length > 0)
        ).map(l => ({
          contact: l.contact || l.name || l.title || '?',
          stage: l.stage || '',
          date: l.createdAt ? new Date(l.createdAt).toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}) : '',
          showingInfo: l.showingInfo || '',
          comments: Array.isArray(l.comments) ? l.comments : [],
          source: l.source || '',
          moveDate: l.moveDate || '',
          income: l.income || '',
          pets: l.pets || '',
        }));
      } catch(e) {}

      let risk = { score: 0, level: 'LOW', factors: [], suggestions: [], compRent: 0, cityData: getCityData(city) };
      try { risk = scoreProperty({ rent, beds, city, leads: totalLeads, showings: scheduledTours + completedTours, dom }); } catch(e) {}

      let petInfo = { label: 'Pets OK*', cls: 'pet-ok' };
      try { petInfo = getPetLabel(u); } catch(e) {}

      const ownerRaw = Array.isArray(u.owners) && u.owners.length > 0 ? u.owners[0] : (Array.isArray(u.portfolio) && u.portfolio.length > 0 ? u.portfolio[0] : null);
      const owner = ownerRaw ? (typeof ownerRaw === 'string' ? ownerRaw : String(ownerRaw.name || ownerRaw.label || '')) : '';

      const safeStr = v => {
        if (v == null) return '';
        if (typeof v === 'string') return v;
        if (typeof v === 'number') return String(v);
        if (typeof v === 'object' && v.name) return String(v.name);
        if (typeof v === 'object' && v.label) return String(v.label);
        return '';
      };

      return {
        cardId: String(u.cardId || ('unit-'+uidx)), 
        address: safeStr(address), city: safeStr(city), 
        rent, beds, baths: safeStr(baths), sqft,
        dom, listDate,
        leads: totalLeads, showings: scheduledTours + completedTours,
        scheduledTours, completedTours, canceledTours, applied,
        appFunnel, appFunnelActive, weeklySourceActivity,
        weeklyActivity, tourLeads,
        petInfo, owner: safeStr(owner),
        availableDate: u.availableDate ? new Date(u.availableDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'TBD',
        rentReady: !!u.rentReady, lockboxNumber: safeStr(u.lockboxNumber),
        virtualTour: safeStr(u.virtualTourUrl), applicationUrl: safeStr(u.applicationUrl),
        ...risk, lostPerDay: rent > 0 ? +(rent / 30).toFixed(2) : 0, lostPerMonth: rent,
      };
      } catch(unitErr) {
        // Return a safe stub if a unit crashes
        return { cardId: 'err-'+uidx, address: u.street||'Unknown', city:'', rent:0, beds:3, baths:'', sqft:0, dom:0, listDate:null, leads:0, showings:0, scheduledTours:0, completedTours:0, canceledTours:0, applied:0, weeklyActivity:[], tourLeads:[], petInfo:{label:'?',cls:'pet-ok'}, owner:'', availableDate:'TBD', score:0, level:'LOW', factors:[], suggestions:[], compRent:0, cityData:{}, lostPerDay:0, lostPerMonth:0 };
      }
    });

    processed.sort((a, b) => (b.score||0) - (a.score||0));
    const high = processed.filter(u => u.level === 'HIGH');
    const medium = processed.filter(u => u.level === 'MEDIUM');
    const low = processed.filter(u => u.level === 'LOW');
    const zeroLeads = processed.filter(u => u.leads === 0);
    const totalLost = processed.reduce((s, u) => s + (u.lostPerMonth||0), 0);
    return { units: processed, high, medium, low, zeroLeads, totalLost };
    } catch(e) {
      console.error('processData error:', e);
      return { units: [], high: [], medium: [], low: [], zeroLeads: [], totalLost: 0 };
    }
  }

  useEffect(() => { fetchAll(); }, []);

  async function fetchSync() {
    setSyncLoading(true);
    try {
      // Fetch Aptly published units
      const aptlyRes = await fetch('/api/aptly/units').then(r => r.json());
      const aptlyUnits = (aptlyRes.units || []);

      // Paginate through all RV units
      async function fetchAllPages(path) {
        let all = [], page = 1;
        while (true) {
          const r = await fetch('/api/rentvine' + path + '&pageSize=200&page=' + page).then(r => r.json());
          if (!Array.isArray(r) || r.length === 0) break;
          all = all.concat(r);
          if (r.length < 200) break;
          page++;
        }
        return all;
      }

      const rvRaw = await fetchAllPages('/properties/units/export?isActive=true');

      // Build unitID -> address map
      const unitMap = {};
      rvRaw.forEach(item => {
        const u = item.unit || item;
        const p = item.property || {};
        unitMap[u.unitID] = u.address || p.address || '';
      });

      // Use the real Rentvine marketing listings endpoint (isActive=1 = actively marketed)
      const rvListingsRaw = await fetchAllPages('/properties/listings');
      const rvMarketed = rvListingsRaw
        .filter(item => item.listing && String(item.listing.isActive) === '1')
        .map(item => ({
          address: unitMap[item.listing.unitID] || item.listing.headline || '',
          propertyID: item.listing.propertyID,
          unitID: item.listing.unitID,
          availabilityDate: item.listing.availabilityDate,
          advertisedDate: item.listing.advertisedDate,
          isZillowActive: item.listing.isZillowActive,
          isWebsiteActive: item.listing.isWebsiteActive,
        }));

      // Match by street number
      const streetNum = s => ((s||'').match(/^\d+/) || [])[0] || '';
      const aptlyNums = new Set(aptlyUnits.map(u => streetNum(u.street||'')).filter(Boolean));
      const rvNums = new Set(rvMarketed.map(a => streetNum(a.address)).filter(Boolean));

      const matched = aptlyUnits.filter(u => rvNums.has(streetNum(u.street||'')));
      const inAptlyNotRV = aptlyUnits.filter(u => !rvNums.has(streetNum(u.street||'')));
      const inRVNotAptly = rvMarketed.filter(a => !aptlyNums.has(streetNum(a.address)));

      setSyncData({
        aptlyCount: aptlyUnits.length,
        rvTotalUnits: rvRaw.length,
        rvTotalListings: rvListingsRaw.length,
        rvMarketedCount: rvMarketed.length,
        matchedCount: matched.length,
        matched,
        inAptlyNotRV,
        inRVNotAptly,
        inRVNotAptlyCount: inRVNotAptly.length,
      });
    } catch(e) { console.error('fetchSync error:', e); }
    finally { setSyncLoading(false); }
  }

  useEffect(() => { if (tab === 'sync' && !syncData) fetchSync(); }, [tab]);

  async function fetchCommercial(city, type, txn) {
    setCommercialLoading(true);
    setCommercialData(null);
    try {
      const params = new URLSearchParams({ city: city||commercialCity, state:'AZ', type: type||commercialType, listingType: txn||commercialTxn, maxItems:30 });
      const data = await fetch('/api/commercial-comps?' + params).then(r=>r.json());
      setCommercialData(data);
    } catch(e) { setCommercialData({ error: e.message }); }
    finally { setCommercialLoading(false); }
  }

  useEffect(() => { if (tab === 'commercial' && !commercialData) fetchCommercial(); }, [tab]);

  const filteredUnits = (data?.units || []).filter(u => {
    const matchFilter = filter === 'ALL' || u.level === filter;
    const addr = (u.address || '').toLowerCase();
    const city = (u.city || '').toLowerCase();
    const owner = (u.owner || '').toLowerCase();
    const matchSearch = !search || addr.includes(search.toLowerCase()) || city.includes(search.toLowerCase()) || owner.includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  const d = data;

  return (
    <div>
      <div className="topbar">
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <a href="/" className="logo"><div className="logo-icon">A</div></a>
          <div>
            <div className="logo-text">Vacancy Risk &amp; Market Intelligence</div>
            <div className="logo-sub">Aloe Property Management — Published Listings Only</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {lastRefresh && <span style={{fontSize:11,color:'var(--text3)'}}>Refreshed: {lastRefresh}</span>}
          {d && <span style={{fontSize:12,color:'var(--teal-d)',fontWeight:600}}>{d.units.length} active listings</span>}
          {d && <span style={{fontSize:11,color:'var(--text3)'}}>of {d.totalInPortfolio} in portfolio</span>}
          <button className="action-btn" onClick={fetchAll} style={{background:'var(--teal)',color:'#fff',border:'none'}}>↻ Refresh</button>
          <a href="/" className="action-btn">← Hub</a>
        </div>
      </div>

      <div className="status-bar">
        <div className="status-item"><span className="dot dot-green"/>Aptly Units: Published listings only</div>
        <div className="status-item"><span className="dot dot-gray"/>Market data: Q1 2026</div>
        {d && <div className="status-item" style={{marginLeft:'auto'}}>
          <span style={{color:'var(--amber)',fontWeight:600}}>{d.zeroLeads.length} zero-lead</span>&nbsp;|&nbsp;
          {d.units.length} published&nbsp;|&nbsp;
          <span style={{color:'var(--red)',fontWeight:600}}>{d.high.length} high risk</span>
        </div>}
      </div>

      <div className="nav">
        {TABS.map(t => (
          <button key={t.id} className={`nav-btn${tab===t.id?' active':''}`} onClick={()=>{ setTab(t.id); window.scrollTo(0,0); }}>{t.label}</button>
        ))}
      </div>

      <div className="main">
        {error && <div className="err">⚠ {error}</div>}
        {loading && <div className="loading"><div className="spinner"/><div>Loading published listings from Aptly…</div><div style={{fontSize:11,color:'var(--text3)'}}>Fetching units, leads, and tour activity</div></div>}

        {!loading && tab==='overview' && d && (
          <div>
            <div className="kpi-row cols-6" style={{marginBottom:16}}>
              <div className="kpi"><div className="kpi-label">Published Listings</div><div className="kpi-value" style={{color:'var(--teal-d)'}}>{d.units.length}</div><div className="kpi-sub">of {d.totalInPortfolio} in portfolio</div></div>
              <div className="kpi"><div className="kpi-label">High Risk</div><div className="kpi-value" style={{color:'var(--red)'}}>{d.high.length}</div><div className="kpi-sub">Need immediate action</div></div>
              <div className="kpi"><div className="kpi-label">Medium Risk</div><div className="kpi-value" style={{color:'var(--amber)'}}>{d.medium.length}</div><div className="kpi-sub">Monitor closely</div></div>
              <div className="kpi"><div className="kpi-label">Low Risk</div><div className="kpi-value" style={{color:'var(--green)'}}>{d.low.length}</div><div className="kpi-sub">On track</div></div>
              <div className="kpi"><div className="kpi-label">Tours Completed</div><div className="kpi-value" style={{color:'var(--blue)'}}>{d.units.reduce((s,u)=>s+u.completedTours,0)}</div><div className="kpi-sub">across all listings</div></div>
              <div className="kpi"><div className="kpi-label">Monthly Vacancy Cost</div><div className="kpi-value" style={{color:'var(--red)',fontSize:22}}>${d.totalLost.toLocaleString()}</div><div className="kpi-sub">Total lost revenue/mo</div></div>
            </div>
            {d.high.length > 0 && (
              <div className="urgent-strip">
                <div className="urgent-count">{d.high.length}</div>
                <div>
                  <div style={{fontWeight:700,color:'var(--red)',fontSize:14}}>URGENT — {d.high.length} {d.high.length===1?'property needs':'properties need'} action</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>High vacancy risk scores require immediate attention</div>
                </div>
              </div>
            )}
            <div className="card" style={{padding:0,overflow:'hidden'}}>
              <div style={{padding:'16px 22px 12px',borderBottom:'1px solid var(--border)'}}>
                <div className="card-title" style={{marginBottom:0}}><span className="card-bar" style={{background:'var(--red)'}}/>Published Listings — Ranked by Risk Score</div>
              </div>
              <div className="prop-hdr-grid" style={{paddingTop:12}}>
                <div className="prop-col-hdr" style={{textAlign:'left'}}>Property</div>
                <div className="prop-col-hdr">Risk</div>
                <div className="prop-col-hdr">Leads / Tours</div>
                <div className="prop-col-hdr">DOM</div>
                <div className="prop-col-hdr">Rent</div>
                <div className="prop-col-hdr">Score</div>
              </div>
              <div style={{padding:'0 0 8px'}}>
                {d.units.slice(0,15).map(u => <PropertyRow key={u.cardId} u={u} expanded={expanded} setExpanded={setExpanded}/>)}
                {d.units.length > 15 && <div style={{textAlign:'center',padding:'12px',fontSize:12,color:'var(--text3)',cursor:'pointer'}} onClick={()=>setTab('properties')}>View all {d.units.length} listings →</div>}
              </div>
            </div>
          </div>
        )}

        {!loading && tab==='properties' && d && (
          <div>
            <div className="page-hdr"><div className="page-title">All Published Listings</div><div className="page-sub">{d.units.length} units published for rent · sorted by risk score</div></div>
            <div className="filters">
              <input className="search-box" placeholder="Search address, city, or owner…" value={search} onChange={e=>setSearch(e.target.value)}/>

                <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:5}}>Property Type</div>
                <select value={commercialType} onChange={e=>setCommercialType(e.target.value)}
                  style={{padding:'8px 12px',border:'1px solid var(--border)',borderRadius:8,fontFamily:'inherit',fontSize:13,background:'var(--bg)',color:'var(--text)',outline:'none'}}>
                  <option value="all">All Types</option>
                  <option value="office">Office</option>
                  <option value="retail">Retail / NNN</option>
                  <option value="industrial">Industrial</option>
                  <option value="multifamily">Multifamily</option>
                  <option value="land">Land</option>
                  <option value="mixed-use">Mixed Use</option>
                </select>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:5}}>Transaction</div>
                <select value={commercialTxn} onChange={e=>setCommercialTxn(e.target.value)}
                  style={{padding:'8px 12px',border:'1px solid var(--border)',borderRadius:8,fontFamily:'inherit',fontSize:13,background:'var(--bg)',color:'var(--text)',outline:'none'}}>
                  <option value="lease">For Lease</option>
                  <option value="sale">For Sale</option>
                  <option value="both">Both</option>
                </select>
              </div>
              <button className="action-btn" onClick={()=>fetchCommercial(commercialCity,commercialType,commercialTxn)}
                style={{background:'var(--teal)',color:'#fff',border:'none',padding:'8px 18px',fontSize:13,fontWeight:600,cursor:'pointer',borderRadius:8}}>
                🔍 Search
              </button>
            </div>

            {/* Loading */}
            {commercialLoading && (
              <div className="loading">
                <div className="spinner"/>
                <div>Pulling {commercialType==='all'?'commercial':commercialType} listings from Crexi for {commercialCity}…</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>First run takes ~30–60s · Results cached 7 days</div>
              </div>
            )}

            {/* Error / No key */}
            {!commercialLoading && commercialData?.error && (
              <div style={{background:commercialData.error.includes('APIFY')?'#eff6ff':'#fef2f2',border:'1px solid '+(commercialData.error.includes('APIFY')?'#bfdbfe':'#fecaca'),borderRadius:12,padding:'24px 28px',textAlign:'center'}}>
                {commercialData.error.includes('APIFY') ? (
                  <>
                    <div style={{fontSize:18,fontWeight:700,color:'#1d4ed8',marginBottom:8}}>🔑 Apify API Key Needed</div>
                    <div style={{fontSize:13,color:'#3b82f6',marginBottom:16}}>Add your Apify key to Render environment variables to enable commercial comp lookups</div>
                    <div style={{textAlign:'left',background:'#fff',borderRadius:10,padding:'14px 18px',display:'inline-block',minWidth:320}}>
                      <div style={{display:'flex',gap:8,marginBottom:8,fontSize:13,color:'var(--text2)'}}><span style={{width:20,height:20,borderRadius:'50%',background:'var(--teal)',color:'#fff',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>1</span><span>Go to <strong>apify.com</strong> → create free account</span></div>
                      <div style={{display:'flex',gap:8,marginBottom:8,fontSize:13,color:'var(--text2)'}}><span style={{width:20,height:20,borderRadius:'50%',background:'var(--teal)',color:'#fff',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>2</span><span>Settings → Integrations → copy <strong>API Token</strong></span></div>
                      <div style={{display:'flex',gap:8,fontSize:13,color:'var(--text2)'}}><span style={{width:20,height:20,borderRadius:'50%',background:'var(--teal)',color:'#fff',fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>3</span><span>Render → Environment → <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:4,fontFamily:'monospace',fontSize:11}}>APIFY_API_KEY = your-token</code></span></div>
                    </div>
                  </>
                ) : (
                  <div style={{color:'var(--red)',fontSize:13}}>❌ {commercialData.error}</div>
                )}
              </div>
            )}

            {/* Results */}
            {!commercialLoading && commercialData && !commercialData.error && (() => {
              const d = commercialData;
              const listings = d.listings || [];
              const stats = d.stats;
              const fmt$ = v => v > 0 ? '$'+Number(Math.round(v)).toLocaleString() : '—';
              const fmtSqft = v => v > 0 ? Number(Math.round(v)).toLocaleString()+' sqft' : '—';

              return (
                <div>
                  {/* KPI strip */}
                  <div className="kpi-row cols-5" style={{marginBottom:16}}>
                    <div className="kpi" style={{borderTop:'3px solid var(--purple)'}}>
                      <div className="kpi-label">Listings Found</div>
                      <div className="kpi-value" style={{color:'var(--purple)'}}>{listings.length}</div>
                      <div className="kpi-sub">{d.city}, AZ · {d.listingType}</div>
                    </div>
                    <div className="kpi">
                      <div className="kpi-label">Median Price</div>
                      <div className="kpi-value" style={{fontSize:20}}>{stats ? fmt$(stats.medianPrice) : '—'}</div>
                      <div className="kpi-sub">{d.listingType==='lease'?'per sqft/yr or total':'asking price'}</div>
                    </div>
                    <div className="kpi">
                      <div className="kpi-label">Avg Price/SqFt</div>
                      <div className="kpi-value" style={{fontSize:20}}>{stats?.avgPricePerSqft > 0 ? '$'+stats.avgPricePerSqft : '—'}</div>
                      <div className="kpi-sub">per square foot</div>
                    </div>
                    <div className="kpi">
                      <div className="kpi-label">Avg Cap Rate</div>
                      <div className="kpi-value" style={{fontSize:20}}>{stats?.avgCapRate || '—'}</div>
                      <div className="kpi-sub">investment return</div>
                    </div>
                    <div className="kpi">
                      <div className="kpi-label">Sources</div>
                      <div className="kpi-value" style={{fontSize:16}}>{(d.sources||[]).join(', ') || '—'}</div>
                      <div className="kpi-sub">{d.fromCache?'Cached 7 days':'Live pull'}</div>
                    </div>
                  </div>

                  {listings.length === 0 ? (
                    <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:10,padding:'24px',textAlign:'center',color:'var(--text3)',fontSize:13}}>
                      No listings found for {d.city} · {d.type} · {d.listingType}. Try a different city or property type, or Crexi may have limited data for this combination.
                    </div>
                  ) : (
                    <div className="card" style={{padding:0,overflow:'hidden'}}>
                      <div style={{padding:'14px 20px 12px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                        <div className="card-title" style={{marginBottom:0}}><span className="card-bar" style={{background:'var(--purple)'}}/>Commercial Listings — {d.city}, AZ ({listings.length})</div>
                        <div style={{fontSize:11,color:'var(--text3)'}}>Via Crexi{d.sources?.includes('loopnet')?' + LoopNet':''} · Apify</div>
                      </div>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                        <thead>
                          <tr style={{background:'var(--bg3)'}}>
                            <th style={{padding:'8px 14px',textAlign:'left',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Address / Property</th>
                            <th style={{padding:'8px 10px',textAlign:'left',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Type</th>
                            <th style={{padding:'8px 10px',textAlign:'right',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Price / Rate</th>
                            <th style={{padding:'8px 10px',textAlign:'right',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Size</th>
                            <th style={{padding:'8px 10px',textAlign:'right',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>$/SqFt</th>
                            <th style={{padding:'8px 10px',textAlign:'right',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Cap Rate</th>
                            <th style={{padding:'8px 10px',textAlign:'right',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>NOI</th>
                            <th style={{padding:'8px 10px',textAlign:'left',color:'var(--text3)',fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',borderBottom:'1px solid var(--border)'}}>Src</th>
                            <th style={{padding:'8px 10px',borderBottom:'1px solid var(--border)'}}></th>
                          </tr>
                        </thead>
                        <tbody>
                          {listings.map((c,i) => (
                            <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                              <td style={{padding:'10px 14px'}}>
                                <div style={{fontWeight:600,color:'var(--text)',fontSize:13}}>{c.address||'—'}</div>
                                {c.tenants && <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>Tenant: {c.tenants}</div>}
                                {c.leaseTerm && <div style={{fontSize:11,color:'var(--text3)'}}>Lease: {c.leaseTerm}</div>}
                              </td>
                              <td style={{padding:'10px',color:'var(--text2)',fontSize:12}}>
                                <span style={{background:'#ede9fe',color:'var(--purple)',padding:'2px 7px',borderRadius:10,fontSize:10,fontWeight:600}}>{c.propertyType||d.type}</span>
                                <div style={{fontSize:10,color:'var(--text3)',marginTop:3}}>{c.listingType}</div>
                              </td>
                              <td style={{padding:'10px',textAlign:'right',fontWeight:700,color:'var(--text)',fontFamily:'var(--mono)',fontSize:13}}>{c.price>0?fmt$(c.price):c.leaseRate>0?fmt$(c.leaseRate)+'/sf/yr':'—'}</td>
                              <td style={{padding:'10px',textAlign:'right',color:'var(--text2)',fontFamily:'var(--mono)',fontSize:12}}>{fmtSqft(c.sqft)}</td>
                              <td style={{padding:'10px',textAlign:'right',color:'var(--text3)',fontFamily:'var(--mono)',fontSize:12}}>{c.pricePerSqft>0?'$'+c.pricePerSqft:'—'}</td>
                              <td style={{padding:'10px',textAlign:'right',fontWeight:600,color:c.capRate>0?'var(--green)':'var(--text3)',fontSize:13}}>{c.capRate>0?c.capRate.toFixed(2)+'%':'—'}</td>
                              <td style={{padding:'10px',textAlign:'right',color:'var(--text2)',fontFamily:'var(--mono)',fontSize:12}}>{c.noi>0?fmt$(c.noi)+'/yr':'—'}</td>
                              <td style={{padding:'10px'}}>
                                <span style={{fontSize:10,padding:'2px 6px',borderRadius:8,fontWeight:600,background:c.source==='crexi'?'#ecfdf5':'#e0f2fe',color:c.source==='crexi'?'#065f46':'#0369a1'}}>{c.source||'?'}</span>
                              </td>
                              <td style={{padding:'10px'}}>
                                {c.listingUrl && <a href={c.listingUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--teal-d)',textDecoration:'none',fontSize:11}}>View ↗</a>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div style={{padding:'10px 14px',fontSize:11,color:'var(--text3)',borderTop:'1px solid var(--border)'}}>
                        Data from Crexi.com via Apify · Cached 7 days · {d.fromCache?'Cached '+new Date(d.fetchedAt).toLocaleDateString():'Fresh pull '+new Date().toLocaleDateString()}
                        <span style={{marginLeft:12,color:'var(--purple)',fontWeight:600}}>Apify cost: ~$0.003/listing</span>
                      </div>
                    </div>
                  )}

                  {/* Quick links */}
                  <div className="card" style={{marginTop:8}}>
                    <div className="card-title"><span className="card-bar" style={{background:'var(--purple)'}}/>Research Links</div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      {[
                        ['🏢 Crexi — For Lease', `https://www.crexi.com/lease/az/${commercialCity.toLowerCase().replace(/\s+/g,'-')}`],
                        ['🏢 Crexi — For Sale', `https://www.crexi.com/properties/az/${commercialCity.toLowerCase().replace(/\s+/g,'-')}`],
                        ['🔍 LoopNet — For Lease', `https://www.loopnet.com/search/commercial-real-estate/${commercialCity.toLowerCase().replace(/\s+/g,'-')}-az/for-lease/`],
                        ['🔍 LoopNet — For Sale', `https://www.loopnet.com/search/commercial-real-estate/${commercialCity.toLowerCase().replace(/\s+/g,'-')}-az/for-sale/`],
                        ['📊 CommercialCafe', `https://www.commercialcafe.com/commercial-property/us/az/${commercialCity.toLowerCase().replace(/\s+/g,'-')}/`],
                      ].map(([label,url]) => (
                        <a key={label} href={url} target="_blank" rel="noopener noreferrer" className="comp-link">{label}</a>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })()}
          </div>
        )}
      </div>
    </div>
  );
}

function PropertyRow({ u, expanded, setExpanded, showComp }) {
  const isExpanded = expanded === u.cardId;
  const pet = u.petInfo || { label: 'Pets OK*', cls: 'pet-ok' };
  const tourIcon = (u.completedTours||0) > 0 ? '✅' : (u.scheduledTours||0) > 0 ? '📅' : '';
  return (
    <>
      <div className={`prop-row ${u.level.toLowerCase()}`} onClick={()=>setExpanded(isExpanded?null:u.cardId)}>
        <div>
          <div className="prop-name">{u.address}<span className={`pet-badge ${pet.cls}`}>{pet.label}</span></div>
          <div className="prop-addr">{u.city}, AZ · {u.beds}bd{u.baths?'/'+u.baths+'ba':''}{u.sqft>0?` · ${u.sqft.toLocaleString()} sqft`:''} · Avail: {u.availableDate}{u.owner?` · ${u.owner}`:''}</div>
        </div>
        <div className="prop-col"><span className={`badge badge-${u.level.toLowerCase()}`}>{u.level} ({u.score})</span></div>
        <div className="prop-col">
          {u.leads||0}L
          {(u.leads||0)>0&&(u.showings||0)===0&&<span className="tag tag-ol">OL</span>}
          {' / '}{tourIcon}{u.completedTours||0}✓{(u.scheduledTours||0)>0&&` ${u.scheduledTours}📅`}
          {(u.canceledTours||0)>0&&<span className="tag tag-ol">{u.canceledTours}✗</span>}
        </div>
        <div className="prop-col">{u.dom>0?u.dom:'—'}{u.dom>30&&<span className="tag tag-dom">{u.dom}d</span>}</div>
        <div className="prop-col">${u.rent>0?u.rent.toLocaleString():'—'}/mo</div>
        <div className="prop-col" style={{fontWeight:700,color:u.score>=50?'var(--red)':u.score>=25?'var(--amber)':'var(--green)'}}>{u.score}</div>
      </div>
      {isExpanded && (
        <div className="detail-panel">
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
            {u.applicationUrl&&<a href={u.applicationUrl} target="_blank" rel="noopener noreferrer" className="comp-link">📝 Apply</a>}
            {u.virtualTour&&<a href={u.virtualTour} target="_blank" rel="noopener noreferrer" className="comp-link">🎥 Virtual Tour</a>}
            {u.lockboxNumber&&<span className="comp-link">🔑 Lockbox: {u.lockboxNumber}</span>}
            {u.rentReady&&<span className="comp-link" style={{color:'var(--green)'}}>✓ Rent Ready</span>}
          </div>

          {/* Weekly activity chart */}
          {u.weeklyActivity && u.weeklyActivity.length > 0 && (
            <div style={{marginBottom:14}}>
              <div className="detail-section" style={{marginBottom:8}}>Weekly Activity Since Listed</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                <div>
                  <div style={{fontSize:10,color:'var(--text3)',marginBottom:4,fontWeight:600}}>LEADS PER WEEK</div>
                  {u.weeklyActivity.map((w,i)=>{
                    const max = Math.max(...u.weeklyActivity.map(x=>x.leads||0).concat([1]));
                    return (
                      <div key={i} className="week-bar">
                        <div className="week-label">{w.label}</div>
                        <div className="week-track"><div className="week-fill" style={{width:`${((w.leads||0)/max)*100}%`}}/></div>
                        <div className="week-count">{w.leads||0}</div>
                      </div>
                    );
                  })}
                </div>
                <div>
                  <div style={{fontSize:10,color:'var(--text3)',marginBottom:4,fontWeight:600}}>TOURS PER WEEK</div>
                  {u.weeklyActivity.map((w,i)=>{
                    const max = Math.max(...u.weeklyActivity.map(x=>x.showings||0).concat([1]));
                    return (
                      <div key={i} className="week-bar">
                        <div className="week-label">{w.label}</div>
                        <div className="week-track"><div className="week-fill" style={{width:`${((w.showings||0)/max)*100}%`,background:'var(--green)'}}/></div>
                        <div className="week-count">{w.showings||0}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
              <div style={{display:'flex',gap:20,marginTop:10,padding:'8px 12px',background:'var(--bg)',borderRadius:6,fontSize:12}}>
                <div><span style={{color:'var(--text3)'}}>Total Leads: </span><strong>{u.leads}</strong></div>
                <div><span style={{color:'var(--text3)'}}>Tours Completed: </span><strong style={{color:'var(--green)'}}>{u.completedTours}</strong></div>
                <div><span style={{color:'var(--text3)'}}>Scheduled: </span><strong style={{color:'var(--blue)'}}>{u.scheduledTours}</strong></div>
                <div><span style={{color:'var(--text3)'}}>Canceled: </span><strong style={{color:'var(--red)'}}>{u.canceledTours}</strong></div>
                {u.applied>0&&<div><span style={{color:'var(--text3)'}}>Applied: </span><strong style={{color:'var(--purple)'}}>{u.applied}</strong></div>}
              </div>
            </div>
          )}

          {/* Tour feedback */}
          {u.tourLeads && u.tourLeads.length > 0 && (
            <div style={{marginBottom:14}}>
              <div className="detail-section" style={{marginBottom:8}}>Tour Feedback</div>
              {u.tourLeads.slice(0,5).map((t,i)=>(
                <div key={i} className="tour-card">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
                    <div style={{fontWeight:600,fontSize:12,color:'var(--text)'}}>{t.contact}</div>
                    <span className={`tour-stage ${STAGE_COLORS[t.stage]||'stage-nurturing'}`}>{t.stage}</span>
                  </div>
                  {t.date&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{t.date}{t.showingInfo&&` · ${String(t.showingInfo).replace(/\([^)]+\)/g,'').trim().substring(0,60)}`}</div>}
                  {t.source&&<div style={{fontSize:10,color:'var(--text3)',marginBottom:4}}>Source: {t.source}</div>}
                  {t.comments && t.comments.length > 0 && (
                    <div style={{marginTop:6,paddingTop:6,borderTop:'1px solid var(--border)'}}>
                      {t.comments.slice(0,3).map((c,ci)=>(
                        <div key={ci} style={{fontSize:11,color:'var(--text2)',marginBottom:3,display:'flex',gap:6}}>
                          <span style={{color:'var(--teal)',flexShrink:0}}>→</span>
                          <span><strong>{typeof c==='object'?c.by||c.userName:'Unknown'}:</strong> {typeof c==='object'?c.note||c.content||c.text:c}</span>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{display:'flex',gap:12,marginTop:4,fontSize:10,color:'var(--text3)'}}>
                    {t.moveDate&&<span>Move: {t.moveDate}</span>}
                    {t.income&&<span>Income: {t.income}</span>}
                    {t.pets&&<span>Pets: {t.pets}</span>}
                  </div>
                </div>
              ))}
            </div>
          )}

          <div className="detail-grid">
            <div>
              <div className="detail-section">Risk Factors</div>
              {u.factors.map((f,i)=><div key={i} className="detail-item">{f}</div>)}
            </div>
            <div>
              <div className="detail-section">Recommendations</div>
              {u.suggestions.slice(0,4).map((s,i)=><div key={i} className="detail-item">{s}</div>)}
            </div>
          </div>
          {showComp&&(
            <div style={{marginTop:12}}>
              <div className="detail-section" style={{marginBottom:6}}>Comp Research</div>
              <div>
                {[
                  ['🏠 Zillow',`https://www.zillow.com/homes/for_rent/${encodeURIComponent(u.address+', '+u.city+', AZ')}/`],
                  ['📊 Rentometer',`https://www.rentometer.com/analysis/new?address=${encodeURIComponent(u.address+', '+u.city+', AZ')}&bedrooms=${u.beds}&rent=${u.rent}`],
                  ['🏡 Apartments.com',`https://www.apartments.com/houses/${u.city.toLowerCase().replace(/\s+/g,'-')}-az/`],
                  ['📈 Redfin',`https://www.redfin.com/rentals/${u.city}-AZ`],
                ].map(([label,url])=><a key={label} href={url} target="_blank" rel="noopener noreferrer" className="comp-link">{label}</a>)}
              </div>
            </div>
          )}
          <div style={{marginTop:10,fontSize:11,color:'var(--text3)'}}>
            Market avg for {u.beds}bd in {u.city}: ${u.compRent?.toLocaleString()||'—'}/mo · {u.cityData?.vacancy_rate||''} vacancy · Avg {u.cityData?.avg_dom||'—'} DOM
          </div>
        </div>
      )}
    </>
  );
}

function OwnerReport({ u }) {
  try {
    const premiumAmt = (u.rent || 0) - (u.compRent || 0);
    const pet = u.petInfo || { label: 'Pets OK*', cls: 'pet-ok' };
    const weekly = u.weeklyActivity || [];
    const tours = u.tourLeads || [];
    const suggestions = u.suggestions || [];
    const leadsPerWeek = weekly.length > 0 ? ((u.leads||0) / weekly.length).toFixed(1) : '—';
    const toursPerWeek = weekly.length > 0 ? (((u.scheduledTours||0) + (u.completedTours||0)) / weekly.length).toFixed(1) : '—';
    const lostPerDay = u.lostPerDay != null ? Number(u.lostPerDay).toFixed(2) : '0.00';
    const lostPerMonth = u.lostPerMonth || 0;
    const level = u.level || 'LOW';
    const compRange = (u.cityData && u.cityData.comp_range) || '—';
    const compRent = u.compRent || 0;

    return (
      <div className="card" style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:'var(--text)'}}>{u.address||'Unknown'}</div>
            <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>
              {u.city||''}, AZ — ${(u.rent||0)>0?(u.rent||0).toLocaleString():'—'}/mo — {u.beds||'?'}bd{u.baths?'/'+u.baths+'ba':''} — <span className={`pet-badge ${pet.cls}`}>{pet.label}</span>
            </div>
            {u.owner&&<div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>Owner: {u.owner}</div>}
          </div>
          <span className={`badge badge-${level.toLowerCase()}`} style={{fontSize:12,padding:'4px 12px'}}>{level}</span>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:20}}>
          {/* Col 1: Marketing summary */}
          <div>
            <div className="detail-section" style={{marginBottom:8}}>Marketing Summary</div>
            <div className="market-row"><span className="market-label">Total Leads</span><span className="market-value">{u.leads||0}</span></div>
            <div className="market-row"><span className="market-label">Leads / Week</span><span className="market-value">{leadsPerWeek}</span></div>
            <div className="market-row"><span className="market-label">Tours Completed</span><span className="market-value" style={{color:'var(--green)'}}>{u.completedTours||0}</span></div>
            <div className="market-row"><span className="market-label">Tours Scheduled</span><span className="market-value" style={{color:'var(--blue)'}}>{u.scheduledTours||0}</span></div>
            <div className="market-row"><span className="market-label">Canceled / No Show</span><span className="market-value" style={{color:'var(--red)'}}>{u.canceledTours||0}</span></div>
            <div className="market-row"><span className="market-label">Tours / Week</span><span className="market-value">{toursPerWeek}</span></div>
            <div className="market-row"><span className="market-label">Applications Started</span><span className="market-value" style={{color:'var(--purple)'}}>{(u.appFunnel?.started||0) + (u.appFunnel?.inProgress||0)}</span></div>
            <div className="market-row"><span className="market-label">In Screening</span><span className="market-value" style={{color:'var(--blue)'}}>{(u.appFunnel?.screeningReady||0) + (u.appFunnel?.screeningInProgress||0) + (u.appFunnel?.awaitingDecision||0)}</span></div>
            <div className="market-row"><span className="market-label">Approved</span><span className="market-value" style={{color:'var(--green)'}}>{u.appFunnel?.approved||0}</span></div>
            <div className="market-row"><span className="market-label">Denied</span><span className="market-value" style={{color:'var(--red)'}}>{u.appFunnel?.denied||0}</span></div>
            <div className="market-row"><span className="market-label">Cancelled</span><span className="market-value" style={{color:'var(--text3)'}}>{u.appFunnel?.cancelled||0}</span></div>
            <div className="market-row"><span className="market-label">Days Listed</span><span className="market-value">{(u.dom||0)>0?u.dom:'< 1'}</span></div>
            <div className="market-row"><span className="market-label">Available Date</span><span className="market-value">{u.availableDate||'TBD'}</span></div>
            <div style={{marginTop:12}} className="detail-section">Vacancy Impact</div>
            <div className="market-row"><span className="market-label">Lost/Day</span><span style={{color:'var(--red)',fontWeight:700}}>${lostPerDay}</span></div>
            <div className="market-row"><span className="market-label">Lost/Month</span><span style={{color:'var(--red)',fontWeight:700}}>${lostPerMonth.toLocaleString()}</span></div>
          </div>

          {/* Col 2: Market position */}
          <div>
            <div className="detail-section" style={{marginBottom:8}}>Market Position</div>
            <div className="market-row"><span className="market-label">Your Rent</span><span className="market-value">${(u.rent||0).toLocaleString()}</span></div>
            <div className="market-row"><span className="market-label">Market Avg ({u.beds||'?'}bd)</span><span className="market-value">${compRent.toLocaleString()}</span></div>
            <div className="market-row"><span className="market-label">Comp Range</span><span className="market-value">{compRange}</span></div>
            <div className="market-row">
              <span className="market-label">vs Market</span>
              <span style={{color:premiumAmt>0?'var(--amber)':'var(--green)',fontWeight:600}}>
                {premiumAmt>0?`+$${premiumAmt.toLocaleString()}/mo above`:premiumAmt<0?`$${Math.abs(premiumAmt).toLocaleString()}/mo below`:'At market'}
              </span>
            </div>
            {suggestions.length>0&&(
              <>
                <div style={{marginTop:16}} className="detail-section">Recommendations</div>
                {suggestions.slice(0,3).map((s,i)=>(
                  <div key={i} style={{fontSize:12,color:'var(--text2)',marginBottom:5,display:'flex',gap:6}}>
                    <span style={{color:'var(--teal)',flexShrink:0}}>→</span>{s}
                  </div>
                ))}
              </>
            )}
          </div>

          {/* Col 3: Weekly breakdown + tour feedback */}
          <div>
            <div className="detail-section" style={{marginBottom:8}}>Activity by Week</div>
            {weekly.length > 0 ? (
              <div style={{marginBottom:12}}>
                {weekly.map((w,i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3,padding:'3px 0',borderBottom:'1px solid var(--bg3)'}}>
                    <span style={{color:'var(--text3)'}}>{w.label}</span>
                    <span style={{color:'var(--text2)'}}>{w.leads} leads / {w.showings} tours</span>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>No weekly data yet</div>
            )}
            <div className="detail-section" style={{marginBottom:8}}>Tour Feedback</div>
            {tours.length > 0 ? (
              tours.slice(0,4).map((t,i)=>(
                <div key={i} style={{marginBottom:8,paddingBottom:8,borderBottom:i<Math.min(tours.length,4)-1?'1px solid var(--border)':'none'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}>
                    <span style={{fontSize:12,fontWeight:600,color:'var(--text)'}}>{t.contact||'Unknown'}</span>
                    <span className={`tour-stage ${STAGE_COLORS[t.stage]||'stage-nurturing'}`}>{t.stage||'—'}</span>
                  </div>
                  {t.date&&<div style={{fontSize:10,color:'var(--text3)'}}>{t.date}</div>}
                  {t.comments && t.comments.length > 0 && (
                    <div style={{fontSize:11,color:'var(--text2)',marginTop:4,fontStyle:'italic'}}>
                      "{typeof t.comments[0]==='object'?(t.comments[0].note||t.comments[0].content||''):String(t.comments[0]||'')}"
                    </div>
                  )}
                </div>
              ))
            ) : (
              <div style={{fontSize:12,color:'var(--text3)'}}>No tour activity yet</div>
            )}
          </div>
        </div>
      </div>
    );
  } catch(err) {
    return (
      <div className="card" style={{marginBottom:12,borderColor:'var(--red)'}}>
        <div style={{fontSize:13,color:'var(--red)'}}>Error rendering report for {u.address||'unknown'}: {err.message}</div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
