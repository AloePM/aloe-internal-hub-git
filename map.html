<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM — Property Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#3CC3E1;--bg:#0f1923;--bg2:#131f2e;--bg3:#1a2a3a;--border:#1e2d3d;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
#header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px}.logo-mark{width:32px;height:32px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--bg);}
.logo-name{font-size:15px;font-weight:600}.logo-sub{font-size:11px;color:var(--text3)}
.stats{display:flex;gap:18px}.stat{text-align:center}.stat-n{font-size:18px;font-weight:700;line-height:1}.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
#s-occ{color:var(--teal)}#s-vac{color:#f59e0b}
#toolbar{display:flex;align-items:center;gap:7px;padding:7px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.fbtn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;}
.fbtn.on{background:var(--teal);color:var(--bg);border-color:var(--teal);font-weight:600}.fbtn:hover:not(.on){border-color:var(--teal);color:var(--teal)}
.rbtn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;}
.rbtn.on{font-weight:600}.rbtn.ev.on{background:#3b82f6;border-color:#3b82f6;color:#fff}.rbtn.cv.on{background:#8b5cf6;border-color:#8b5cf6;color:#fff}.rbtn.wv.on{background:#f59e0b;border-color:#f59e0b;color:#000}.rbtn.pinal.on{background:#ef4444;border-color:#ef4444;color:#fff}
.sep{width:1px;height:20px;background:var(--border);margin:0 2px}
#search{margin-left:auto;padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px;width:190px;outline:none;}
#search::placeholder{color:var(--text3)}#search:focus{border-color:var(--teal)}
.refresh-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap;}
.refresh-btn:hover{border-color:var(--teal);color:var(--teal)}
#layout{display:flex;height:calc(100vh - 54px - 44px)}
#map{flex:1;position:relative}
#panel{width:265px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#panel-head{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text3);display:flex;align-items:center;justify-content:space-between;}
#panel-list{flex:1;overflow-y:auto;padding:4px 0}
#panel-list::-webkit-scrollbar{width:4px}#panel-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.prow{padding:7px 14px;cursor:pointer;border-bottom:1px solid rgba(30,45,61,.5);transition:background .1s;display:flex;align-items:center;gap:9px;}
.prow:hover{background:var(--bg3)}.prow.active{background:rgba(60,195,225,0.12);border-left:3px solid var(--teal)}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.pdot.occ{background:var(--teal)}.pdot.vac{background:#f59e0b}
.prow-info{min-width:0}.prow-addr{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-meta{font-size:10px;color:var(--text3);margin-top:2px;display:flex;gap:5px;align-items:center}
.prow-region{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600}
#overlay{position:fixed;inset:0;background:rgba(15,25,35,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;gap:14px;}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#ov-title{font-size:17px;font-weight:600}#ov-msg{font-size:13px;color:var(--text2);text-align:center;max-width:300px;line-height:1.6}
#ov-err{color:#ef4444;font-size:13px;display:none;text-align:center;max-width:300px}
#ov-retry{padding:9px 22px;background:var(--teal);color:var(--bg);border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:none;}
#dist-bar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(19,31,46,.97);border:1px solid var(--border);border-radius:12px;padding:10px 18px;z-index:1000;font-size:13px;display:none;align-items:center;gap:12px;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);min-width:300px}
#dist-bar.show{display:flex}#dist-text{color:var(--text);flex:1}
#dist-clear{background:none;border:1px solid var(--border);color:var(--text3);font-size:11px;padding:3px 10px;border-radius:8px;cursor:pointer;}
#dist-clear:hover{border-color:#ef4444;color:#ef4444}
#legend{position:absolute;top:12px;right:8px;z-index:1000;background:rgba(19,31,46,.95);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:11px;}
.leg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;cursor:pointer;opacity:.85;transition:opacity .15s;user-select:none}
.leg-row:hover{opacity:1}.leg-row:last-child{margin-bottom:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leaflet-popup-content-wrapper{background:var(--bg2) !important;border:1px solid var(--border) !important;border-radius:10px !important;box-shadow:0 8px 28px rgba(0,0,0,.5) !important;}
.leaflet-popup-tip{background:var(--bg2) !important}.leaflet-popup-content{margin:12px 15px !important;color:var(--text)}
.pu-title{font-size:13px;font-weight:700;margin-bottom:3px}.pu-city{font-size:11px;color:var(--text3);margin-bottom:8px}
.pu-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.pu-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.pu-badge.occ{background:rgba(60,195,225,.12);color:var(--teal);border:1px solid rgba(60,195,225,.3)}
.pu-badge.vac{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.pu-region{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.pu-detail{font-size:11px;color:var(--text3);margin-bottom:8px}
.pu-dist-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;width:100%;text-align:center;}
.pu-dist-btn:hover{border-color:var(--teal);color:var(--teal)}.pu-dist-btn.sel{background:rgba(60,195,225,.15);border-color:var(--teal);color:var(--teal)}
</style>
</head>
<body>
<div id="header">
  <div class="logo"><div class="logo-mark">A</div><div><div class="logo-name">Aloe Property Management</div><div class="logo-sub">Portfolio Map — Phoenix Metro + Pinal County</div></div></div>
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-occ">-</div><div class="stat-l">Occupied</div></div>
    <div class="stat"><div class="stat-n" id="s-vac">-</div><div class="stat-l">Vacant</div></div>
    <div class="stat"><div class="stat-n" id="s-tot">-</div><div class="stat-l">Shown</div></div>
    <div class="stat"><div class="stat-n" id="s-all" style="color:var(--text3)">-</div><div class="stat-l">Total</div></div>
  </div>
</div>
<div id="toolbar">
  <button class="fbtn on" data-f="all">All</button>
  <button class="fbtn" data-f="occupied">Occupied</button>
  <button class="fbtn" data-f="vacant">Vacant</button>
  <div class="sep"></div>
  <button class="rbtn ev" data-r="East Valley">East Valley</button>
  <button class="rbtn cv" data-r="Central Valley">Central</button>
  <button class="rbtn wv" data-r="West Valley">West Valley</button>
  <button class="rbtn pinal" data-r="Pinal County">Pinal Co.</button>
  <input id="search" type="text" placeholder="Search address or city..."/>
  <button class="refresh-btn" onclick="loadProperties(true)">↻ Refresh</button>
</div>
<div id="layout">
  <div id="map">
    <div id="dist-bar"><span id="dist-text">Click a pin, then click Measure</span><button id="dist-clear" onclick="clearDist()">✕ Clear</button></div>
    <div id="legend">
      <div class="leg-row" onclick="toggleR('East Valley')"><div class="leg-sq" style="background:#3b82f6;opacity:.7"></div>East Valley</div>
      <div class="leg-row" onclick="toggleR('Central Valley')"><div class="leg-sq" style="background:#8b5cf6;opacity:.7"></div>Central Valley</div>
      <div class="leg-row" onclick="toggleR('West Valley')"><div class="leg-sq" style="background:#f59e0b;opacity:.7"></div>West Valley</div>
      <div class="leg-row" onclick="toggleR('Pinal County')"><div class="leg-sq" style="background:#ef4444;opacity:.7"></div>Pinal County</div>
      <div style="border-top:1px solid var(--border);margin:6px 0"></div>
      <div class="leg-row" style="cursor:default"><div class="leg-dot" style="background:#3CC3E1"></div>Occupied</div>
      <div class="leg-row" style="cursor:default"><div class="leg-dot" style="background:#f59e0b"></div>Vacant</div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-head"><span>Properties (<span id="panel-count">0</span>)</span><span id="dist-label" style="color:var(--teal);font-size:10px;display:none">📏 Pick A then B</span></div>
    <div id="panel-list"></div>
  </div>
</div>
<div id="overlay">
  <div class="spin"></div>
  <div id="ov-title">Loading Portfolio</div>
  <div id="ov-msg">Fetching properties from Rentvine...</div>
  <div id="ov-err"></div>
  <button id="ov-retry" onclick="loadProperties(false)">Retry</button>
</div>
<script>
const REGIONS={
  'Apache Junction':'East Valley','Arizona City':'Pinal County','Avondale':'West Valley',
  'Buckeye':'West Valley','Casa Grande':'Pinal County','Cave Creek':'Central Valley',
  'Chandler':'East Valley','Coolidge':'Pinal County','Eloy':'Pinal County',
  'Florence':'Pinal County','Fountain Hills':'Central Valley','Gilbert':'East Valley',
  'Glendale':'West Valley','Goodyear':'West Valley','Litchfield Park':'West Valley',
  'Maricopa':'Pinal County','Mesa':'East Valley','Paradise Valley':'Central Valley',
  'Peoria':'West Valley','Phoenix':'Central Valley','Queen Creek':'East Valley',
  'Rio Verde':'Central Valley','San Tan Valley':'East Valley','Scottsdale':'Central Valley',
  'Surprise':'West Valley','Sun Lakes':'East Valley','Tempe':'East Valley',
  'Tolleson':'West Valley','Ahwatukee':'East Valley','Sun City':'West Valley',
  'Sun City West':'West Valley','Waddell':'West Valley','El Mirage':'West Valley',
  'Laveen':'West Valley','Gold Canyon':'East Valley','Anthem':'Central Valley'
};
const RC={
  'East Valley':{fill:'#3b82f6',text:'#93c5fd',bg:'rgba(59,130,246,0.15)',border:'rgba(59,130,246,0.4)'},
  'Central Valley':{fill:'#8b5cf6',text:'#c4b5fd',bg:'rgba(139,92,246,0.15)',border:'rgba(139,92,246,0.4)'},
  'West Valley':{fill:'#f59e0b',text:'#92400e',bg:'rgba(245,158,11,0.18)',border:'rgba(245,158,11,0.5)'},
  'Pinal County':{fill:'#ef4444',text:'#fca5a5',bg:'rgba(239,68,68,0.15)',border:'rgba(239,68,68,0.4)'},
  'Unknown':{fill:'#64748b',text:'#94a3b8',bg:'rgba(100,116,139,0.12)',border:'rgba(100,116,139,0.3)'}
};
function region(city){return REGIONS[city]||'Unknown';}

const map=L.map('map',{zoomControl:false}).setView([33.36,-111.79],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'CartoDB',maxZoom:19}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

function mkIcon(vac,selA,selB){
  const c=selA?'#3CC3E1':(selB?'#ffffff':(vac?'#f59e0b':'#3CC3E1'));
  const ring=selA||selB?'white':'none';
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 24 32">'
    +'<path d="M12 0C5.37 0 0 5.37 0 12c0 7.75 12 20 12 20S24 19.75 24 12C24 5.37 18.63 0 12 0z" fill="'+c+'"/>'
    +'<circle cx="12" cy="12" r="5" fill="'+ring+'" opacity=".9"/>'
    +'</svg>';
  return L.divIcon({html:svg,className:'',iconSize:[22,30],iconAnchor:[11,30],popupAnchor:[0,-32]});
}

let all=[],ml=L.layerGroup().addTo(map);
let fOcc='all',fRegion=new Set(),fSearch='',activeRow=null;
let distA=null,distB=null,distLine=null,distMode=false;
window._P={};

document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');fOcc=b.dataset.f;render();
}));
document.querySelectorAll('.rbtn').forEach(b=>b.addEventListener('click',()=>{
  const r=b.dataset.r;if(fRegion.has(r)){fRegion.delete(r);b.classList.remove('on');}else{fRegion.add(r);b.classList.add('on');}render();
}));
document.getElementById('search').addEventListener('input',e=>{fSearch=e.target.value;render();});
function toggleR(r){document.querySelector('.rbtn[data-r="'+r+'"]').click();}

function vis(p){
  if(!p.lat||!p.lng)return false;
  if(fOcc==='occupied'&&p.isVacant)return false;
  if(fOcc==='vacant'&&!p.isVacant)return false;
  if(fRegion.size>0&&!fRegion.has(p.region))return false;
  if(fSearch){const s=fSearch.toLowerCase();if(!p.address.toLowerCase().includes(s)&&!(p.city||'').toLowerCase().includes(s))return false;}
  return true;
}

function haversine(a,b){
  const R=3958.8,dL=(b.lat-a.lat)*Math.PI/180,dN=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dN/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function startDist(p){
  distMode=true;
  document.getElementById('dist-bar').classList.add('show');
  document.getElementById('dist-label').style.display='inline';
  if(!distA){distA=p;document.getElementById('dist-text').textContent='A: '+p.address.slice(0,35)+'... — now pick Point B';}
  else if(!distB){
    distB=p;
    if(distLine)map.removeLayer(distLine);
    distLine=L.polyline([[distA.lat,distA.lng],[distB.lat,distB.lng]],{color:'#3CC3E1',weight:2,dashArray:'6 3',opacity:.85}).addTo(map);
    const mi=haversine(distA,distB).toFixed(1);
    const km=(haversine(distA,distB)*1.60934).toFixed(1);
    document.getElementById('dist-text').textContent=distA.address.split(' ').slice(0,2).join(' ')+' → '+distB.address.split(' ').slice(0,2).join(' ')+' = '+mi+' mi / '+km+' km';
  } else {
    distA=p;distB=null;if(distLine){map.removeLayer(distLine);distLine=null;}
    document.getElementById('dist-text').textContent='A: '+p.address.slice(0,35)+'... — now pick Point B';
  }
  render();
}

function clearDist(){
  distMode=false;distA=null;distB=null;
  if(distLine){map.removeLayer(distLine);distLine=null;}
  document.getElementById('dist-bar').classList.remove('show');
  document.getElementById('dist-label').style.display='none';
  render();
}

function render(){
  ml.clearLayers();
  const list=document.getElementById('panel-list');list.innerHTML='';
  const shown=all.filter(vis);
  shown.forEach(p=>{
    const isA=distA&&distA.propertyID===p.propertyID;
    const isB=distB&&distB.propertyID===p.propertyID;
    const rc=RC[p.region]||RC['Unknown'];
    const m=L.marker([p.lat,p.lng],{icon:mkIcon(p.isVacant,isA,isB)});
    const badge=p.isVacant?'<span class="pu-badge vac">Vacant</span>':'<span class="pu-badge occ">Occupied</span>';
    const rb='<span class="pu-region" style="background:'+rc.bg+';color:'+rc.text+';border:1px solid '+rc.border+'">'+p.region+'</span>';
    const det=[p.beds?p.beds+' bd':'',p.baths?p.baths+' ba':'',p.rent?'$'+Number(p.rent).toLocaleString()+'/mo':''].filter(Boolean).join(' · ');
    const dbLabel=isA?'✓ Point A selected':(isB?'✓ Point B selected':'📏 Measure distance from here');
    const dbClass=isA||isB?'pu-dist-btn sel':'pu-dist-btn';
    m.bindPopup(
      '<div class="pu-title">'+p.address+'</div>'+
      '<div class="pu-city">'+(p.city||'')+', AZ</div>'+
      '<div class="pu-row">'+badge+rb+'</div>'+
      (det?'<div class="pu-detail">'+det+'</div>':'')+
      '<button class="'+dbClass+'" onclick="startDist(window._P[\''+p.propertyID+'\']);this.closest(\'.leaflet-popup\').remove();">'+dbLabel+'</button>'
    );
    p._m=m;ml.addLayer(m);
    const row=document.createElement('div');row.className='prow';
    row.innerHTML='<div class="pdot '+(p.isVacant?'vac':'occ')+'"></div><div class="prow-info"><div class="prow-addr">'+p.address+'</div><div class="prow-meta"><span>'+(p.city||'AZ')+'</span><span class="prow-region" style="background:'+rc.bg+';color:'+rc.text+'">'+p.region+'</span></div></div>';
    row.addEventListener('click',()=>{if(activeRow)activeRow.classList.remove('active');row.classList.add('active');activeRow=row;map.setView([p.lat,p.lng],15,{animate:true});m.openPopup();});
    list.appendChild(row);
  });
  document.getElementById('panel-count').textContent=shown.length;
  document.getElementById('s-occ').textContent=shown.filter(p=>!p.isVacant).length;
  document.getElementById('s-vac').textContent=shown.filter(p=>p.isVacant).length;
  document.getElementById('s-tot').textContent=shown.length;
  document.getElementById('s-all').textContent=all.filter(p=>p.lat&&p.lng).length;
}

function setMsg(t,m){document.getElementById('ov-title').textContent=t;document.getElementById('ov-msg').textContent=m;}
function showErr(msg){document.getElementById('ov-err').style.display='block';document.getElementById('ov-err').textContent=msg;document.getElementById('ov-retry').style.display='block';}
function hideOverlay(){document.getElementById('overlay').style.display='none';}

async function loadProperties(force){
  force=force||false;
  document.getElementById('overlay').style.display='flex';
  document.getElementById('ov-err').style.display='none';
  document.getElementById('ov-retry').style.display='none';
  all=[];window._P={};
  try{
    setMsg('Loading Portfolio','Fetching properties from Rentvine...');
    const resp=await fetch('/api/map-properties'+(force?'?refresh=1':''));
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const props=data.properties||[];
    if(!props.length)throw new Error('No active properties returned.');
    props.forEach(p=>{p.region=region(p.city);window._P[p.propertyID]=p;});
    all=props;
    const wc=all.filter(p=>p.lat&&p.lng).length;
    if(!wc)throw new Error('No coordinates found on properties.');
    setTimeout(()=>{
      render();
      const ll=all.filter(p=>p.lat&&p.lng).map(p=>[p.lat,p.lng]);
      if(ll.length)map.fitBounds(L.latLngBounds(ll).pad(0.05));
      hideOverlay();
    },200);
  }catch(e){showErr('Error: '+e.message);}
}
loadProperties();
</script>
<script src="/hub-shell.js" defer></script>
</body>
</html>
