<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aloe PM · Bills Recon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F4F8;
  --panel:#FFFFFF;
  --border:#CBD5E1;
  --border-light:#E2E8F0;
  --teal:#0891B2;
  --teal-light:#E0F2FE;
  --teal-border:#7DD3FC;
  --green:#059669;
  --green-light:#D1FAE5;
  --green-border:#6EE7B7;
  --amber:#D97706;
  --amber-light:#FEF3C7;
  --amber-border:#FCD34D;
  --red:#DC2626;
  --red-light:#FEE2E2;
  --red-border:#FCA5A5;
  --purple:#7C3AED;
  --purple-light:#EDE9FE;
  --purple-border:#C4B5FD;
  --text:#0F172A;
  --text2:#475569;
  --muted:#94A3B8;

}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  max-height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  font-size:13px;
}

/* ── TOP BAR ─────────────────────────────────────────────────────────── */
.topbar{
  height:var(--header-h);
  background:#0C1929;
  display:flex;
  align-items:center;
  padding:0 16px;

}
.topbar-logo{

  font-size:11px;
  font-weight:500;
  color:#94A3B8;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.topbar-logo span{color:var(--teal)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.top-btn{

  border:1px solid rgba(255,255,255,.15);
  border-radius:5px;
  padding:4px 10px;
  color:#CBD5E1;
  font-size:11px;
  cursor:pointer;

}
.top-btn:hover{background:rgba(255,255,255,.15);color:#fff}

.top-btn.accent:hover{background:#0e7490}

/* ── TOOLBAR ─────────────────────────────────────────────────────────── */
.toolbar{
  height:var(--toolbar-h);
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 12px;

  flex-wrap:nowrap;

}
.toolbar-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 2px}
.tb-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tb-btn{
  background:none;border:1px solid var(--border);border-radius:5px;
  padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer;
  font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .12s;
}
.tb-btn:hover{border-color:var(--teal);color:var(--teal)}
.tb-btn.active{background:var(--teal-light);border-color:var(--teal-border);color:var(--teal);font-weight:600}
.tb-btn.green{background:var(--green-light);border-color:var(--green-border);color:var(--green)}
.tb-btn.amber{background:var(--amber-light);border-color:var(--amber-border);color:var(--amber)}
.tb-btn.red-btn{background:var(--red-light);border-color:var(--red-border);color:var(--red)}
.srch{
  background:#F8FAFC;border:1px solid var(--border);border-radius:5px;

/* ── MAIN LAYOUT: two panels side by side ────────────────────────────── */

  grid-template-columns:1fr auto 1fr;

.panel{display:flex;flex-direction:column;overflow:hidden;background:var(--panel);height:100%}
.panel-left{border-right:1px solid var(--border)}
.panel-divider{
  width:36px;
  background:#F8FAFC;
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:8px;
  gap:6px;
  flex-shrink:0;
  height:100%;
  overflow:hidden;
}
.div-icon{
  font-size:10px;
  color:var(--muted);
  writing-mode:vertical-rl;
  text-orientation:mixed;
  transform:rotate(180deg);

.panel-header{
  height:36px;
  display:flex;
  align-items:center;
  padding:0 10px;

  gap:8px;

}

  font-family:'DM Mono',monospace;

/* ── COL HEADERS ─────────────────────────────────────────────────────── */
.col-header{
  display:grid;

.col-header span{

  letter-spacing:.07em;

  text-overflow:ellipsis;

}
.col-header span:hover{color:var(--teal)}
.col-header span.sort-asc::after{content:' ↑'}
.col-header span.sort-desc::after{content:' ↓'}

/* RV cols: date | ledger/owner | account | amount | paid */
.rv-cols{grid-template-columns:72px 1fr 100px 68px 50px}
/* Chase cols: date | description | card | amount */  
.chase-cols{grid-template-columns:72px 1fr 44px 68px}

/* ── SCROLL AREA ─────────────────────────────────────────────────────── */
.rows-wrap{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.rows-wrap::-webkit-scrollbar{width:6px}
.rows-wrap::-webkit-scrollbar-track{background:transparent}
.rows-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── ROWS ────────────────────────────────────────────────────────────── */
.row{
  display:grid;
  padding:0 6px;
  min-height:34px;
  align-items:center;
  border-bottom:1px solid var(--border-light);
  cursor:pointer;
  transition:background .08s,box-shadow .08s;

}
.row:hover{background:#F0F9FF}

/* Row states */
.row.matched{background:var(--green-light)}
.row.matched:hover{background:#BBF7D0}
.row.manual-linked{background:var(--purple-light)}
.row.manual-linked:hover{background:#DDD6FE}
.row.selected{
  background:#DBEAFE !important;
  box-shadow:inset 2px 0 0 var(--teal),inset -2px 0 0 var(--teal);
}
.row.pending-link{
  background:#FEF9C3 !important;
  box-shadow:inset 2px 0 0 var(--amber);
  animation:pulse-amber .8s ease-in-out infinite alternate;
}
@keyframes pulse-amber{from{background:#FEF9C3}to{background:#FDE68A}}
.row.dimmed{opacity:.35}
.row.auto-partial{background:var(--amber-light)}
.row.auto-partial:hover{background:#FDE68A}

/* ── ROW CELLS ───────────────────────────────────────────────────────── */
.cell{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  padding:0 3px;
}
.cell.date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2)}
.cell.amt{font-family:'DM Mono',monospace;font-weight:500;text-align:right}

.cell.amt.positive{color:var(--green)}

  flex-shrink:0;
}
.dot-green{background:var(--green)}
.dot-purple{background:var(--purple)}

/* ── MINI BADGES ─────────────────────────────────────────────────────── */
.badge{
  display:inline-block;
  padding:1px 5px;
  border-radius:10px;
  font-size:9px;
  font-weight:600;
  font-family:'DM Mono',monospace;
  white-space:nowrap;
  line-height:1.4;
}
.b-paid{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7}
.b-unpaid{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}

/* ── STATUS BAR ──────────────────────────────────────────────────────── */
.statusbar{
  height:28px;
  background:#0C1929;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:20px;
  flex-shrink:0;
  border-top:1px solid rgba(255,255,255,.08);
}
.sb-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#64748B}
.sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sb-val{font-family:'DM Mono',monospace;font-weight:500;color:#94A3B8}
.sb-right{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:#475569}

/* ── LINK MODE OVERLAY ───────────────────────────────────────────────── */
.link-mode-banner{
  background:linear-gradient(90deg,#7C3AED,#6D28D9);
  color:#fff;
  padding:6px 14px;
  font-size:11px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  display:none;
}
.link-mode-banner.visible{display:flex}
.link-cancel{
  margin-left:auto;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);
  border-radius:4px;
  padding:2px 9px;

/* ── CONFIG SCREEN ───────────────────────────────────────────────────── */
.config-screen{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  padding:32px;
  background:var(--bg);
}
.config-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:24px;
  width:100%;
  max-width:680px;
}
.config-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.drop-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop-box{
  border:1.5px dashed var(--border);
  border-radius:8px;
  padding:16px 12px;
  text-align:center;

}
.drop-box:hover,.drop-box.over,.drop-box.filled{border-color:var(--teal);background:var(--teal-light)}
.drop-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.drop-icon{font-size:18px;margin-bottom:4px}
.drop-name{font-size:11px;font-weight:600;color:var(--text)}
.drop-sub{font-size:10px;color:var(--muted);line-height:1.4;margin-top:2px}
.run-btn{
  background:var(--teal);border:none;border-radius:7px;
  padding:12px;color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;
  margin-top:14px;transition:background .12s;
}
.run-btn:hover{background:#0e7490}
.run-btn:disabled{background:#CBD5E1;color:#94A3B8;cursor:not-allowed}
.config-info{
  background:var(--teal-light);border:1px solid var(--teal-border);
  border-radius:7px;padding:10px 14px;font-size:11px;color:var(--teal);
  line-height:1.7;width:100%;max-width:680px;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const ST = {
  screen: 'config',
  chaseFile: null, chaseText: '',
  rvFile: null,    rvText: '',
  plaidChase: null,
  error: '',

  // Parsed rows — never mutated after parsing
  rvRows: [],
  chaseRows: [],

  // Links: { rvId: chaseId } and reverse — covers auto + manual
  links: {},        // rvId → chaseId
  linksRev: {},     // chaseId → rvId
  linkTypes: {},    // rvId → 'auto'|'partial'|'manual'

  // Manual linking mode
  linkMode: false,
  linkSourceSide: null, // 'rv' or 'chase'
  linkSourceId: null,

  // Selected (highlighted) rows
  selectedRV: null,
  selectedChase: null,

  // Filters & sort
  filter: 'all',       // all|matched|unmatched|unpaid|partial
  search: '',
  rvSort: 'date_desc',
  chaseSort: 'date_desc',

  // Scroll sync flag
  _scrolling: false,
};

function set(p){ Object.assign(ST, p); render(); }

// ─────────────────────────────────────────────────────────────────────────────
// PARSE
// ─────────────────────────────────────────────────────────────────────────────
function pl(line){
  const f=[]; let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"')q=!q;
    else if(line[i]===','&&!q){f.push(c.trim());c='';}
    else c+=line[i];
  }
  f.push(c.trim()); return f;
}
function pd(d){
  if(!d) return '';
  const s=String(d).trim().replace(/^"|"$/g,'').replace(/&amp;/g,'&');
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m=s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(m) return `${m[3]}-${m[1]}-${m[2]}`;
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}
  return s;
}
function pamt(s){ return Math.abs(parseFloat((s||'').replace(/[$,\s]/g,'')))||0; }

function parseChase(text){
  const lines=text.trim().split(/\r?\n/);
  const h=pl(lines[0]);
  const hi=k=>h.findIndex(x=>x.toLowerCase().includes(k.toLowerCase()));
  const iDate=hi('Transaction Date'),iDesc=hi('Description'),iAmt=hi('Amount'),iType=hi('Type'),iCard=hi('Card');
  return lines.slice(1).map((l,i)=>{
    const v=pl(l);
    const type=(v[iType]||'').trim();
    const rawAmt=parseFloat((v[iAmt]||'').replace(/[$,]/g,''))||0;
    if(!rawAmt) return null;
    if(type!=='Sale'&&rawAmt>=0) return null;
    const date=pd(v[iDate]);
    const amount=Math.abs(rawAmt);
    if(!date||!amount) return null;
    return {
      id:'c'+i,
      date, amount,
      description:(v[iDesc]||'').replace(/&amp;/g,'&').trim(),
      card:(v[iCard]||'').trim().slice(-4),
    };
  }).filter(Boolean);
}

function parseRVPayables(text){
  const lines=text.trim().split(/\r?\n/);
  let hi2=-1;
  for(let i=0;i<lines.length;i++){
    if(lines[i].includes('Date Posted')&&lines[i].includes('Charge Amount')){ hi2=i; break; }
  }
  if(hi2<0) throw new Error('Cannot find "Date Posted" header in Rentvine CSV');
  const h=pl(lines[hi2]);
  const hi=k=>h.findIndex(x=>x.toLowerCase().replace(/"/g,'').trim().includes(k.toLowerCase()));
  const iDate=hi('Date Posted'),iLedger=hi('Ledger'),iUnit=hi('Unit');
  const iAcct=hi('Charge Account'),iAmt=hi('Charge Amount'),iPaid=hi('Amount Paid');
  const iUnpaid=hi('Amount Unpaid'),iDesc=hi('Description'),iVoided=hi('Voided');
  return lines.slice(hi2+1).map((l,i)=>{
    if(!l.trim()) return null;
    const v=pl(l);
    const date=pd(v[iDate]);
    const amount=pamt(v[iAmt]);
    if(!date||!amount) return null;
    const voided=(v[iVoided]||'').toLowerCase()==='yes';
    if(voided) return null;
    const ledger=(v[iLedger]||'').replace(/^"|"$/g,'').trim();
    if(!ledger||ledger.toLowerCase()==='totals') return null;
    return {
      id:'r'+i,
      date, amount,
      amountPaid:pamt(v[iPaid]),
      amountUnpaid:pamt(v[iUnpaid]),
      ledger,
      unit:(v[iUnit]||'').replace(/^"|"$/g,'').trim(),
      account:(v[iAcct]||'').replace(/^"|"$/g,'').trim().replace(/^\d+[-:]\s*/,''),
      description:(v[iDesc]||'').replace(/^"|"$/g,'').trim(),
    };
  }).filter(Boolean);
}

// ─────────────────────────────────────────────────────────────────────────────
// AUTO-MATCH
// ─────────────────────────────────────────────────────────────────────────────
function daysDiff(a,b){
  try{return Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);}catch(e){return 999;}
}
function autoMatch(rvRows, chaseRows){
  const links={}, linksRev={}, linkTypes={};
  const usedChase=new Set();

  // Pass 1: exact amount + within 45 days
  rvRows.forEach(rv=>{
    let best=null, bestDiff=999;
    chaseRows.forEach(c=>{
      if(usedChase.has(c.id)) return;
      if(Math.abs(c.amount-rv.amount)>0.02) return;
      const dd=daysDiff(c.date,rv.date);
      if(dd<=45&&dd<bestDiff){bestDiff=dd;best=c;}
    });
    if(best){
      links[rv.id]=best.id; linksRev[best.id]=rv.id;
      linkTypes[rv.id]='auto'; usedChase.add(best.id);
    }
  });

  // Pass 2: amount within $5 + within 45 days (partial)
  rvRows.forEach(rv=>{
    if(links[rv.id]) return;
    let best=null, bestDiff=999;
    chaseRows.forEach(c=>{
      if(usedChase.has(c.id)) return;
      if(Math.abs(c.amount-rv.amount)>5) return;
      const dd=daysDiff(c.date,rv.date);
      if(dd<=45&&dd<bestDiff){bestDiff=dd;best=c;}
    });
    if(best){
      links[rv.id]=best.id; linksRev[best.id]=rv.id;
      linkTypes[rv.id]='partial'; usedChase.add(best.id);
    }
  });

  return {links, linksRev, linkTypes};
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
function fmtDate(d){
  if(!d) return '';
  try{const dt=new Date(d+'T12:00:00');return `${dt.getMonth()+1}/${dt.getDate()}/${String(dt.getFullYear()).slice(2)}`;}
  catch(e){return d;}
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─────────────────────────────────────────────────────────────────────────────
// RUN
// ─────────────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────────
// FETCH RV BILLS FROM API
// ─────────────────────────────────────────────────────────────────────────────
async function fetchRVBills(){
  const VENDOR=/aloe property management.*reimburs/i;
  // Only fetch bills from last 90 days to avoid endless pagination
  const endDate = new Date().toISOString().slice(0,10);
  const cutoffDate = shiftDate(endDate, -90);
  let all=[], page=1;

  while(page <= 20){ // hard cap at 20 pages
    const r=await fetch(`/api/rentvine/accounting/bills?page=${page}&pageSize=200`);
    if(!r.ok) throw new Error(`Rentvine bills API returned ${r.status}`);
    const d=await r.json();
    const rows=Array.isArray(d)?d:(d?.data??[]);
    if(!rows.length) break;

    let hitCutoff = false;
    rows.forEach(row=>{
      const b=row.bill, name=row.contact?.name||'';
      if(!b||!VENDOR.test(name)) return;
      const date=(b.billDate||b.dateDue||'').slice(0,10);
      // Bills are ordered newest first — stop once we pass 90-day cutoff
      if(date && date < cutoffDate){ hitCutoff=true; return; }
      all.push({
        billID:    b.billID,
        date,
        reference: (b.reference||'').trim(),
        memo:      (b.paymentMemo||b.description||'').trim(),
        vendor:    name,
        workOrderID: b.workOrderID||'',
        matched:   false,
      });
    });

    if(rows.length<200 || hitCutoff) break;
    page++;
  }
  return all;
}

async function run(){
  // Chase required (Plaid or CSV)
  try{
    // Get Chase transactions — Plaid preferred, CSV fallback
    let chaseRows=[];
    if(ST.plaidChase?.connected){
      const chaseEnd=new Date().toISOString().slice(0,10);
      const cutoff=shiftDate(chaseEnd,-90);
      const pr=await fetch(`/api/plaid/transactions?account_key=chase&start_date=${cutoff}&end_date=${chaseEnd}`);
      if(!pr.ok) throw new Error('Plaid Chase fetch failed: '+pr.status);
      const pd=await pr.json();
      chaseRows=(pd.transactions||[]).map(t=>({
        id:'pl'+t.transactionId, date:t.date,
        description:t.description, amount:t.amount, card:'···8412',
      }));
      if(!chaseRows.length) throw new Error('No Chase charges found via Plaid for the last 90 days');
    } else {
      const chaseAll=parseChase(ST.chaseText);
      const chaseDates=chaseAll.map(r=>r.date).sort();
      const chaseEnd=chaseDates[chaseDates.length-1];
      const cutoff=shiftDate(chaseEnd,-90);
      chaseRows=chaseAll.filter(r=>r.date>=cutoff);
    }

    // Fetch RV bills from API automatically
    set({loadMsg:'Fetching Rentvine Aloe PM Reimbursement bills…'});
    const rvRows = await fetchRVBills();
    if(!rvRows.length) throw new Error('No Aloe PM Reimbursement bills found in Rentvine. Check that bills exist with vendor "Aloe Property Management - REIMBURSEMENTS".');
    const {links,linksRev,linkTypes}=autoMatch(rvRows,chaseRows);

    set({
      screen:'recon',
      rvRows, chaseRows,
      links, linksRev, linkTypes,
      filter:'all', search:'',
      rvSort:'date_desc', chaseSort:'date_desc',
      selectedRV:null, selectedChase:null,
      linkMode:false, linkSourceSide:null, linkSourceId:null,
      error:'',
    });
  }catch(e){set({error:e.message});}
}
function shiftDate(d,days){
  try{const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+days);return dt.toISOString().slice(0,10);}
  catch(e){return d;}
}

// ─────────────────────────────────────────────────────────────────────────────
// FILTER & SORT
// ─────────────────────────────────────────────────────────────────────────────
function filteredRV(){
  let rows=[...ST.rvRows];
  const q=ST.search.toLowerCase();
  if(ST.filter==='matched')   rows=rows.filter(r=>ST.links[r.id]);
  if(ST.filter==='unmatched') rows=rows.filter(r=>!ST.links[r.id]);
  if(ST.filter==='unpaid')    rows=rows.filter(r=>r.amountUnpaid>0);
  if(ST.filter==='partial')   rows=rows.filter(r=>ST.linkTypes[r.id]==='partial');
  if(q) rows=rows.filter(r=>(r.ledger+r.account+r.description+fmt(r.amount)+fmtDate(r.date)).toLowerCase().includes(q));
  return sortRows(rows, ST.rvSort, 'rv');
}
function filteredChase(){
  let rows=[...ST.chaseRows];
  const q=ST.search.toLowerCase();
  if(ST.filter==='matched')   rows=rows.filter(r=>ST.linksRev[r.id]);
  if(ST.filter==='unmatched') rows=rows.filter(r=>!ST.linksRev[r.id]);
  if(q) rows=rows.filter(r=>(r.description+fmt(r.amount)+fmtDate(r.date)+r.card).toLowerCase().includes(q));
  return sortRows(rows, ST.chaseSort, 'chase');
}
function sortRows(rows, sort, side){
  const [col,dir]=sort.split('_');
  const d=dir==='asc'?1:-1;
  return rows.sort((a,b)=>{
    if(col==='date') return d*a.date.localeCompare(b.date);
    if(col==='amt')  return d*(a.amount-b.amount);
    if(col==='ledger') return d*(a.ledger||'').localeCompare(b.ledger||'');
    if(col==='desc') return d*(a.description||'').localeCompare(b.description||'');
    return 0;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// LINKING
// ─────────────────────────────────────────────────────────────────────────────
function startLinkMode(side, id){
  set({linkMode:true, linkSourceSide:side, linkSourceId:id});
}
function cancelLinkMode(){
  set({linkMode:false, linkSourceSide:null, linkSourceId:null});
}
function applyLink(rvId, chaseId){
  // Remove old links
  const oldChase=ST.links[rvId];
  const oldRV=ST.linksRev[chaseId];
  const links={...ST.links};
  const linksRev={...ST.linksRev};
  const linkTypes={...ST.linkTypes};
  if(oldChase){delete linksRev[oldChase];}
  if(oldRV){delete links[oldRV];delete linkTypes[oldRV];}
  links[rvId]=chaseId;
  linksRev[chaseId]=rvId;
  linkTypes[rvId]='manual';
  set({links,linksRev,linkTypes,linkMode:false,linkSourceSide:null,linkSourceId:null,selectedRV:rvId,selectedChase:chaseId});
}
function removeLink(rvId){
  const chaseId=ST.links[rvId];
  const links={...ST.links};
  const linksRev={...ST.linksRev};
  const linkTypes={...ST.linkTypes};
  delete links[rvId];
  if(chaseId) delete linksRev[chaseId];
  delete linkTypes[rvId];
  set({links,linksRev,linkTypes});
}
function clickRow(side, id){
  if(ST.linkMode){
    // Complete the link
    if(ST.linkSourceSide===side) return cancelLinkMode();
    const rvId  = side==='rv'    ? id : ST.linkSourceId;
    const cId   = side==='chase' ? id : ST.linkSourceId;
    applyLink(rvId, cId);
    return;
  }
  // Normal select — highlight + show partner
  if(side==='rv'){
    const partner=ST.links[id]||null;
    set({selectedRV:id, selectedChase:partner});
  } else {
    const partner=ST.linksRev[id]||null;
    set({selectedChase:id, selectedRV:partner});
  }
}

function exportUnmatched(){
  const lines=[['Side','Date','Details','Amount','Notes']];
  ST.rvRows.filter(r=>!ST.links[r.id]).forEach(r=>{
    lines.push(['RV no Chase match',r.date,`"${r.ledger} — ${r.account}"`,r.amount.toFixed(2),'Find matching Chase charge']);
  });
  ST.chaseRows.filter(c=>!ST.linksRev[c.id]).forEach(c=>{
    lines.push(['Chase not in RV',c.date,`"${c.description.replace(/"/g,'""')}"`,c.amount.toFixed(2),'Add bill to Rentvine']);
  });
  const csv=lines.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv,'+encodeURIComponent(csv);
  a.download='aloe_bills_unmatched_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

async function loadPlaidChase(){
  const area=document.getElementById('chase-plaid-area');
  if(!area) return;
  try{
    const sd=await fetch('/api/plaid/status').then(r=>r.json());
    const acct=sd.accounts?.chase;
    if(acct?.connected){
      const bd=await fetch('/api/plaid/balances').then(r=>r.json());
      const bal=bd.chase;
      const balStr=bal?.available!=null?('$'+Math.abs(bal.available).toLocaleString('en-US',{minimumFractionDigits:2})+' available'):'';
      ST.plaidChase={connected:true,name:acct.name,balance:balStr};
      area.innerHTML=`<div style="background:var(--teal-light);border:1px solid var(--teal-border);border-radius:6px;padding:7px 10px;display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0"></div>
        <div><div style="font-size:11px;font-weight:600;color:var(--teal)">${acct.name}</div>
        ${balStr?`<div style="font-size:10px;color:var(--teal)">${balStr}</div>`:''}
        <div style="font-size:10px;color:var(--teal-dk)">Transactions pulled automatically · last 90 days</div></div>
      </div>`;
      // Enable run button without full re-render
      const btn=document.getElementById('run-btn');
      if(btn) btn.disabled=false;
    } else {
      ST.plaidChase=null;
      area.innerHTML=`<div style="font-size:10px;color:var(--muted);padding:2px 0 6px">No Plaid connection · <a href="/bank-setup" style="color:var(--teal)">Connect Chase via Plaid</a> or upload CSV below.</div>`;
    }
  }catch(e){
    ST.plaidChase=null;
    area.innerHTML=`<div style="font-size:10px;color:var(--muted);padding:2px 0 6px">Upload Chase CSV below.</div>`;
  }
}

function bindAll(){
  if(ST.screen==='config'){
    bindDrop('drop-chase','fi-chase',(f,t)=>set({chaseFile:f,chaseText:t}));
    setTimeout(loadPlaidChase, 100); // defer so DOM is painted first
    // Rentvine pulled automatically — no CSV bind needed
    document.getElementById('run-btn')?.addEventListener('click',run);
    return;
  }

  // Toolbar
  document.getElementById('back-btn')?.addEventListener('click',()=>set({screen:'config'}));
  document.getElementById('export-btn')?.addEventListener('click',exportUnmatched);
  document.getElementById('srch')?.addEventListener('input',e=>set({search:e.target.value}));
  document.getElementById('rv-sort-sel')?.addEventListener('change',e=>set({rvSort:e.target.value}));
  document.getElementById('link-mode-btn')?.addEventListener('click',()=>set({linkMode:true,linkSourceSide:null,linkSourceId:null}));
  document.getElementById('cancel-link-btn')?.addEventListener('click',cancelLinkMode);
  document.getElementById('unlink-btn')?.addEventListener('click',()=>{if(ST.selectedRV)removeLink(ST.selectedRV);});

  // Filter buttons
  document.querySelectorAll('[data-filter]').forEach(btn=>
    btn.addEventListener('click',()=>set({filter:btn.dataset.filter}))
  );

  // Sort headers
  document.querySelectorAll('[data-rv-sort]').forEach(th=>
    th.addEventListener('click',()=>{
      const col=th.dataset.rvSort;
      const cur=ST.rvSort;
      const [c,d]=cur.split('_');
      set({rvSort:c===col?(d==='asc'?col+'_desc':col+'_asc'):col+'_desc'});
    })
  );
  document.querySelectorAll('[data-chase-sort]').forEach(th=>
    th.addEventListener('click',()=>{
      const col=th.dataset.chaseSort;
      const [c,d]=ST.chaseSort.split('_');
      set({chaseSort:c===col?(d==='asc'?col+'_desc':col+'_asc'):col+'_desc'});
    })
  );

  // Row clicks — delegate
  document.querySelectorAll('.row').forEach(row=>{
    row.addEventListener('click',()=>{
      const side=row.dataset.side, id=row.dataset.id;
      if(ST.linkMode){
        if(!ST.linkSourceId){
          // First click — set source
          set({linkSourceSide:side,linkSourceId:id});
        } else {
          // Second click — complete link
          if(ST.linkSourceSide===side){
            // Same side — change source
            set({linkSourceId:id});
          } else {
            const rvId=  side==='rv'    ? id : ST.linkSourceId;
            const chaseId=side==='chase' ? id : ST.linkSourceId;
            applyLink(rvId,chaseId);
          }
        }
      } else {
        clickRow(side,id);
        // Scroll partner into view
        setTimeout(()=>{
          const partnerId=side==='rv'?ST.links[id]:ST.linksRev[id];
          if(partnerId){
            const scrollWrap=side==='rv'?document.getElementById('chase-scroll'):document.getElementById('rv-scroll');
            const partnerRow=scrollWrap?.querySelector(`[data-id="${partnerId}"]`);
            partnerRow?.scrollIntoView({behavior:'smooth',block:'nearest'});
          }
        },50);
      }
    });

    // Right-click to unlink
    row.addEventListener('contextmenu',e=>{
      e.preventDefault();
      const side=row.dataset.side, id=row.dataset.id;
      if(side==='rv'&&ST.links[id]) removeLink(id);
      else if(side==='chase'&&ST.linksRev[id]) removeLink(ST.linksRev[id]);
    });
  });
}

function bindDrop(dropId,inputId,cb){
  const drop=document.getElementById(dropId),fi=document.getElementById(inputId);
  if(!drop||!fi) return;
  drop.addEventListener('click',()=>fi.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');hf(e.dataTransfer.files[0],cb);});
  fi.addEventListener('change',e=>hf(e.target.files[0],cb));
}
async function hf(file,cb){if(!file)return;const text=await file.text();cb(file,text);}

render();
</script>
<script src="/hub-shell.js" defer></script>
